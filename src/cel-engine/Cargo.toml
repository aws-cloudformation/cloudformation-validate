[package]
name = "cel-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cel_engine"
path = "src/lib.rs"

[dependencies]
validation-engine = { path = "../validation-engine" }
diagnostics = { path = "../diagnostics" }
rules = { path = "../rules" }
template-model = { path = "../template-model" }
guard-translator = { path = "../guard-translator" }
data-source = { path = "../data-source", default-features = false }
cel-interpreter = { version = "0.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnetwork = "0.21.1"
anyhow = "1"
log = "0.4"
web-time = "1"
regex = "1"

[dev-dependencies]
schema-validator = { path = "../schema-validator" }
validation-engine = { path = "../validation-engine", features = ["test-support"] }
