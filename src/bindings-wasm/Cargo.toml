[package]
name = "bindings-wasm"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
validation-engine = { workspace = true, features = ["wasm-bindings"] }
diagnostics = { workspace = true, features = ["wasm-bindings"] }
rules = { workspace = true, features = ["wasm-bindings"] }
template-model = { workspace = true, features = ["wasm-bindings"] }
rego-engine = { workspace = true }
cel-engine = { workspace = true }
schema-validator = { workspace = true, features = ["wasm-bindings"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5", features = ["js"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O3",
    "--enable-bulk-memory",
    "--enable-simd",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-reference-types",
    "--enable-mutable-globals",
]

[lints]
workspace = true
