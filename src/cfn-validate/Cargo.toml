[package]
name = "cfn-validate"
publish = false
default-run = "cfn-validate"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "cfn_validate"
path = "src/lib.rs"

[[bin]]
name = "cfn-validate"
path = "src/main.rs"

[[bin]]
name = "cfn-benchmark"
path = "src/benchmark.rs"

[dependencies]
data-source = { workspace = true }
template-model = { workspace = true }
diagnostics = { workspace = true }
validation-engine = { workspace = true }
rules = { workspace = true }
schema-validator = { workspace = true }
rego-engine = { workspace = true }
cel-engine = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
resources = { path = "../resources" }
tempfile = "3"
validation-engine = { workspace = true, features = ["test"] }

[lints]
workspace = true
