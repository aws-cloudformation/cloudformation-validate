AWSTemplateFormatVersion: "2010-09-09"
Resources:
  Function:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200 });
      Handler: index.handler
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/lambda-role"
      Runtime: nodejs22.x
      Environment:
        Variables:
          TZ: :UTC
