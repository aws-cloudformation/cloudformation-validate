AWSTemplateFormatVersion: "2010-09-09"
Resources:
  # ExecutionRoleArn uses the `aws-iso` partition.
  # The role ARN format accepts every `aws`-prefixed partition rather than a
  # hardcoded subset, so this deployable partition must not raise a
  # format diagnostic in any engine.
  # See https://github.com/aws-cloudformation/cloudformation-validate/issues/36
  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ExecutionRoleArn: arn:aws-iso:iam::123456789012:role/my-task-role
