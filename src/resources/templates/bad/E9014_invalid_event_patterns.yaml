AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Event patterns that EventBridge rejects with "Event pattern is not valid",
  in both the object and the JSON string form, on rules and archives.
Resources:
  UnknownOperatorRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        source: [example.app]
        detail:
          name: [{startsWith: order-}]
  NumericComparisonRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        detail:
          price: [{numeric: ["=>", 10]}]
  AnythingButNestedRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        detail:
          state: [{anything-but: {exists: true}}]
  PrefixNumberRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        detail:
          code: [{prefix: 5}]
  ExistsStringRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        detail:
          error: [{exists: "true"}]
  ConsecutiveWildcardRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        detail:
          path: [{wildcard: "a**b"}]
  OrWithSiblingRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        detail:
          $or:
            - x: ["1"]
          y: ["2"]
  EmptyArrayRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        source: []
  ScalarValueStringRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern: '{"source": "aws.ec2"}'
  Bus:
    Type: AWS::Events::EventBus
    Properties:
      Name: invalid-event-pattern-bus
  NestedScalarArchive:
    Type: AWS::Events::Archive
    Properties:
      SourceArn: !GetAtt Bus.Arn
      EventPattern:
        detail:
          a:
            b:
              c: plain
