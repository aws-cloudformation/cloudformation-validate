AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  S3 rejects a lifecycle rule that reaches a storage class no later than a
  class above it in the waterfall: GLACIER one day before STANDARD_IA, and
  ONEZONE_IA on the same day as INTELLIGENT_TIERING.
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: GlacierBeforeInfrequentAccess
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90
              - StorageClass: GLACIER
                TransitionInDays: 89
          - Id: SameDay
            Status: Enabled
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 60
              - StorageClass: ONEZONE_IA
                TransitionInDays: 60
