AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  Policy:
    Type: String
  Toggle:
    Type: String
    AllowedValues: [enabled, disabled]
Mappings:
  CreationValues:
    Primary:
      Policy: not-an-object
Conditions:
  Never: !Equals [always, never]
  Maybe: !Equals [!Ref Toggle, enabled]
Resources:
  ListPolicies:
    Type: AWS::S3::Bucket
    DeletionPolicy: [Retain]
    UpdateReplacePolicy: [Retain]

  ObjectPolicies:
    Type: AWS::S3::Bucket
    DeletionPolicy:
      Value: Retain
    UpdateReplacePolicy:
      Value: Retain

  CreationRootRef:
    Type: AWS::CloudFormation::WaitCondition
    CreationPolicy: !Ref Policy

  CreationRootFindInMap:
    Type: AWS::CloudFormation::WaitCondition
    CreationPolicy: !FindInMap [CreationValues, Primary, Policy]

  CreationRootSelect:
    Type: AWS::CloudFormation::WaitCondition
    CreationPolicy: !Select
      - 0
      - - ResourceSignal: {Count: 1}
        - ResourceSignal: {Count: 2}

  CreationRootSub:
    Type: AWS::CloudFormation::WaitCondition
    CreationPolicy: !Sub
      - '${Value}'
      - Value: not-an-object

  CreationConditionalInvalid:
    Type: AWS::CloudFormation::WaitCondition
    CreationPolicy: !If [Maybe, {ResourceSignal: {Count: 1}}, invalid]

  CreationNoValueOnUnsupportedType:
    Type: AWS::S3::Bucket
    CreationPolicy: !Ref AWS::NoValue

  IntrinsicPoliciesWithoutTransform:
    Type: AWS::CloudFormation::WaitConditionHandle
    DeletionPolicy: !If [Never, Retain, Delete]
    UpdateReplacePolicy: !Ref Policy

  NoValuePoliciesWithoutTransform:
    Type: AWS::SQS::Queue
    DeletionPolicy: !Ref AWS::NoValue
    UpdateReplacePolicy: !Ref AWS::NoValue

  UnreachableIntrinsics:
    Type: AWS::CloudFormation::WaitConditionHandle
    Condition: Never
    CreationPolicy: !Ref Policy
    DeletionPolicy: !Ref Policy
    UpdateReplacePolicy: !Ref Policy
