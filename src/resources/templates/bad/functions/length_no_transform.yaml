AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Template using Fn::Length without declaring AWS::LanguageExtensions
  transform. Should trigger E1030 at every permitted value slot.
Parameters:
  MyList:
    Type: CommaDelimitedList
    Default: a,b
Resources:
  Queue:
    Type: AWS::SQS::Queue
    Properties:
      DelaySeconds:
        Fn::Length:
          - !Ref MyList
