AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  S3 rejects an Intelligent-Tiering configuration whose DEEP_ARCHIVE_ACCESS
  days are not greater than its ARCHIVE_ACCESS days: equal days, deep archive
  listed first with fewer days, and fewer days authored as strings.
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      IntelligentTieringConfigurations:
        - Id: EqualDays
          Status: Enabled
          Tierings:
            - AccessTier: ARCHIVE_ACCESS
              Days: 180
            - AccessTier: DEEP_ARCHIVE_ACCESS
              Days: 180
        - Id: DeepArchiveFirst
          Status: Enabled
          Tierings:
            - AccessTier: DEEP_ARCHIVE_ACCESS
              Days: 200
            - AccessTier: ARCHIVE_ACCESS
              Days: 365
        - Id: StringDays
          Status: Enabled
          Tierings:
            - AccessTier: ARCHIVE_ACCESS
              Days: "365"
            - AccessTier: DEEP_ARCHIVE_ACCESS
              Days: "200"
