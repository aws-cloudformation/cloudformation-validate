AWSTemplateFormatVersion: "2010-09-09"
Description: Intrinsic functions inside resource Metadata Context do not satisfy the published Context schema.
Parameters:
  Environment:
    Type: String
    AllowedValues:
      - production
      - development
Conditions:
  IsProduction: !Equals [!Ref Environment, production]
Metadata:
  com.aws.cloudformation.Context:
    arch: parameterized event queues
Resources:
  ConditionalContextQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context: !If
        - IsProduction
        - why: buffers production events
        - why: buffers development events
  IntrinsicFieldQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: !Sub "Buffers ${Environment} events"
        must:
          - !Sub "Queue must remain in the ${AWS::Region} region"
        trust:
          src: authored
          conf: high
  SubMutabilityQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: exercises intrinsic rejection in the mutability map
        mutability: !Sub "${Environment}-review-required"
  ConditionalMutabilityQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: exercises conditional intrinsic rejection in the mutability map
        mutability: !If
          - IsProduction
          - QueueName: review-required
          - QueueName: free-to-tune
