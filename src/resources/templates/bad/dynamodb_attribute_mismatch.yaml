AWSTemplateFormatVersion: "2010-09-09"
Resources:
  BadTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bad-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
