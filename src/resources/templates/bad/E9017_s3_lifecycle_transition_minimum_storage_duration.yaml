AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  S3 rejects a lifecycle rule that moves objects on to an archive class before
  they have stayed the minimum storage duration in the class they leave: 29
  days in STANDARD_IA, and 89 days in GLACIER_IR.
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: InfrequentAccessToGlacier
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER
                TransitionInDays: 59
          - Id: InstantRetrievalToDeepArchive
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 4
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 93
