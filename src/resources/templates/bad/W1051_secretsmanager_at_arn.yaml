AWSTemplateFormatVersion: '2010-09-09'
# A Secrets Manager dynamic reference at a Secrets-Manager-ARN-expecting
# property expands to the secret VALUE, not the ARN. The DMS endpoint's
# SecretsManagerSecretId field requires the ARN of the secret, so this
# substring will deploy a value where an ARN was needed.
Resources:
  Endpoint:
    Type: AWS::DMS::Endpoint
    Properties:
      EndpointType: source
      EngineName: mysql
      SecretsManagerSecretId: '{{resolve:secretsmanager:MySecret:SecretString:secret_arn}}'
      SecretsManagerAccessRoleArn: arn:aws:iam::123456789012:role/dms-access
