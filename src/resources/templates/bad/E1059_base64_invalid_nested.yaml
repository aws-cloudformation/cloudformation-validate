AWSTemplateFormatVersion: "2010-09-09"
Description: E1059 - Fn::Base64 does not support certain nested functions
Resources:
  MyFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
            return "hello"
      Environment:
        Variables:
          Encoded:
            Fn::Base64:
              Fn::Contains:
                - ["a", "b"]
                - "a"
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
