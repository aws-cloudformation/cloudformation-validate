AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Context blocks that depart from the published schema at both placements: wrong
  field types, unrecognized enum values, a missing required trust field, an
  unrecognized nested field, fields placed at the wrong level, fields the schema
  does not define, and a block that is not a mapping. One finding per violation.
Metadata:
  com.aws.cloudformation.Context:
    arch:
      - not-a-string
    why: "This field belongs on a resource"
    ref:
      - has: "Missing required at field"
      - 7
    gaps:
      - "Not a schema field"
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context: "just a string"
  Queue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: 42
        must: "not-an-array"
        mutable: "sometimes"
        mutability:
          QueueName: "never-ish"
        trust:
          conf: "certain"
          extra: true
        ref: []
        unknown: true
