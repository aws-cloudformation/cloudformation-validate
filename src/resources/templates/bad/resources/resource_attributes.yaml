AWSTemplateFormatVersion: "2010-09-09"
Description: Resource attribute contract violations CloudFormation rejects.

Resources:
  UnknownAttribute:
    Type: AWS::SNS::Topic
    BadAttribute: test
  MisspelledCondition:
    Type: AWS::SNS::Topic
    Conditions: IsProd
  MissingType:
    Properties:
      TopicName: no-type
  EmptyBody: {}
  NonStringType:
    Type: !Ref AWS::Region
  NonStringCondition:
    Type: AWS::SNS::Topic
    Condition: false
  NonLiteralDependsOn:
    Type: AWS::SNS::Topic
    DependsOn:
    - !Ref UnknownAttribute
  IntrinsicDependsOn:
    Type: AWS::SNS::Topic
    DependsOn: !Ref UnknownAttribute
  VersionOnManagedResource:
    Type: AWS::SNS::Topic
    Version: "1.0"
  CustomWithCreationPolicy:
    Type: Custom::Provider
    Version: "1.0"
    CreationPolicy:
      ResourceSignal:
        Count: 1
    Properties:
      ServiceToken: !Ref UnknownAttribute
  CustomWithUpdatePolicy:
    Type: AWS::CloudFormation::CustomResource
    UpdatePolicy:
      AutoScalingReplacingUpdate:
        WillReplace: true
    Properties:
      ServiceToken: !Ref UnknownAttribute
  ScalarCreationPolicy:
    Type: AWS::SNS::Topic
    CreationPolicy: nope
  ScalarResourceBody: not-an-object
