---
AWSTemplateFormatVersion: "2010-09-09"
Description: IAM resource ARNs cannot use a wildcard in the service segment.
Resources:
  WildcardServicePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:GetObject
            Resource: "arn:aws:*:::example-bucket/*"
