AWSTemplateFormatVersion: '2010-09-09'
Description: Exercises unsupported Fargate properties inside conditional whole-resource properties.

Parameters:
  Mode:
    Type: String
    AllowedValues: [fargate, ec2]

Conditions:
  IsFargate: !Equals [!Ref Mode, fargate]

Resources:
  PlacementInFargateBranch:
    Type: AWS::ECS::TaskDefinition
    Properties: !If
      - IsFargate
      - RequiresCompatibilities: [FARGATE]
        NetworkMode: awsvpc
        Cpu: '256'
        Memory: '512'
        PlacementConstraints:
          - Type: memberOf
            Expression: 'attribute:ecs.instance-type =~ t3.*'
        ContainerDefinitions:
          - Name: app
            Image: nginx
            Essential: true
      - RequiresCompatibilities: [EC2]
        ContainerDefinitions:
          - Name: app
            Image: nginx
            Essential: true

  InvalidDriverInFargateBranch:
    Type: AWS::ECS::TaskDefinition
    Properties: !If
      - IsFargate
      - RequiresCompatibilities: [FARGATE]
        NetworkMode: awsvpc
        Cpu: '256'
        Memory: '512'
        ContainerDefinitions:
          - Name: app
            Image: nginx
            Essential: true
            LogConfiguration:
              LogDriver: syslog
      - RequiresCompatibilities: [EC2]
        ContainerDefinitions:
          - Name: app
            Image: nginx
            Essential: true
