AWSTemplateFormatVersion: '2010-09-09'
Description: Exercises invalid DynamoDB property worlds independently.

Conditions:
  OnDemand: !Equals [!Ref AWS::Region, us-east-1]
  HasGSI: !Equals [!Ref AWS::Region, us-west-2]
  HasLSI: !Equals [!Ref AWS::Region, eu-west-1]

Resources:
  MissingDefaultThroughput:
    Type: AWS::DynamoDB::Table
    Properties: !If
      - OnDemand
      - BillingMode: PAY_PER_REQUEST
        AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
        KeySchema: [{AttributeName: pk, KeyType: HASH}]
      - AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
        KeySchema: [{AttributeName: pk, KeyType: HASH}]

  ConditionalGSI:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: gsi_key, AttributeType: S}
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      GlobalSecondaryIndexes: !If
        - HasGSI
        - - IndexName: by-gsi
            KeySchema: [{AttributeName: gsi_key, KeyType: HASH}]
            Projection: {ProjectionType: ALL}
        - !Ref AWS::NoValue

  ConditionalLSI:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: lsi_key, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      LocalSecondaryIndexes: !If
        - HasLSI
        - - IndexName: by-lsi
            KeySchema:
              - {AttributeName: pk, KeyType: HASH}
              - {AttributeName: lsi_key, KeyType: RANGE}
            Projection: {ProjectionType: ALL}
        - !Ref AWS::NoValue
