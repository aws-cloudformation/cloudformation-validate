AWSTemplateFormatVersion: "2010-09-09"
Resources:
  MyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: my-function
      Runtime: python3.12
      Handler: index.handler
      Code:
        ZipFile: |
          def handler(event, context):
            return "hello"
      Environment:
        Variables:
          REGION: "AWS::Region"
          ACCOUNT: "AWS::AccountId"
