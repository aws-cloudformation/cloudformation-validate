AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  S3 replicates only into a bucket with versioning enabled. Both destinations
  in this template fail that: one has no VersioningConfiguration and the other
  has versioning suspended.
Resources:
  ReplicationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sts:AssumeRole
  UnversionedDestination:
    Type: AWS::S3::Bucket
  SuspendedDestination:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Suspended
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      ReplicationConfiguration:
        Role: !GetAtt ReplicationRole.Arn
        Rules:
          - Id: ToUnversioned
            Status: Enabled
            Prefix: unversioned/
            Destination:
              Bucket: !GetAtt UnversionedDestination.Arn
          - Id: ToSuspended
            Status: Enabled
            Prefix: suspended/
            Destination:
              Bucket: !GetAtt SuspendedDestination.Arn
