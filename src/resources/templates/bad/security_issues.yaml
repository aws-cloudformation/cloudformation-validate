AWSTemplateFormatVersion: "2010-09-09"
Resources:
  OpenSSH:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bad SG
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
  WildcardPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: bad-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "*"
            Resource: "*"
