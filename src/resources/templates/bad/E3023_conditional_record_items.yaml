AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  Mode:
    Type: String
    AllowedValues: [good, bad]
Conditions:
  UseGood: !Equals [!Ref Mode, good]
Resources:
  Standalone:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: example.com.
      Name: standalone.example.com.
      Type: A
      TTL: "300"
      ResourceRecords:
        - !If [UseGood, 192.0.2.1, 999.0.2.1]
  Group:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: example.com.
      RecordSets:
        - Name: group.example.com.
          Type: A
          TTL: "300"
          ResourceRecords:
            - !If [UseGood, 192.0.2.2, 999.0.2.2]
