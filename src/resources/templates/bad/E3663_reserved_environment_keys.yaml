AWSTemplateFormatVersion: "2010-09-09"
Resources:
  Function:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/lambda-role
      Code:
        S3Bucket: deployment-artifacts
        S3Key: function.zip
      Environment:
        Variables:
          AWS_ACCESS_KEY: placeholder
          AWS_LAMBDA_INITIALIZATION_TYPE: placeholder
      Tags:
        - Key: Purpose
          Value: validation
