AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  An application load balancer (explicitly typed or defaulted) must span at
  least two subnets, given either as Subnets or as SubnetMappings.
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
  AlbDefaultTypeOneSubnet:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Subnets:
        - !Ref SubnetA
  AlbExplicitTypeOneSubnet:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Subnets:
        - subnet-0123456789abcdef0
  AlbOneSubnetMapping:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      SubnetMappings:
        - SubnetId: !Ref SubnetA
