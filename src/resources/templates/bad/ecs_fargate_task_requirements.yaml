AWSTemplateFormatVersion: "2010-09-09"
Description: Fargate task definitions violating the requirements Fargate imposes.

Parameters:
  PlacementMode:
    Type: String
    Default: pinned
    AllowedValues:
    - managed
    - pinned

Conditions:
  PinPlacement: !Equals [!Ref PlacementMode, pinned]

Resources:
  MissingTaskSize:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: missing-task-size
      RequiresCompatibilities:
      - FARGATE
      ContainerDefinitions:
      - Name: app
        Image: nginx
        Essential: true

  WrongNetworkMode:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: wrong-network-mode
      RequiresCompatibilities:
      - FARGATE
      NetworkMode: bridge
      Cpu: "256"
      Memory: "512"
      ContainerDefinitions:
      - Name: app
        Image: nginx
        Essential: true

  UnsupportedCpuUnits:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: unsupported-cpu-units
      RequiresCompatibilities:
      - FARGATE
      NetworkMode: awsvpc
      Cpu: "300"
      Memory: "512"
      ContainerDefinitions:
      - Name: app
        Image: nginx
        Essential: true

  UnsupportedVcpuSize:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: unsupported-vcpu-size
      RequiresCompatibilities:
      - FARGATE
      NetworkMode: awsvpc
      Cpu: 3 vCPU
      Memory: "4096"
      ContainerDefinitions:
      - Name: app
        Image: nginx
        Essential: true

  PinnedPlacement:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: pinned-placement
      RequiresCompatibilities:
      - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      PlacementConstraints:
      - Type: memberOf
        Expression: attribute:ecs.instance-type =~ t2.*
      ContainerDefinitions:
      - Name: app
        Image: nginx
        Essential: true

  UnsupportedLogDriver:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: unsupported-log-driver
      RequiresCompatibilities:
      - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ContainerDefinitions:
      - Name: app
        Image: nginx
        Essential: true
        LogConfiguration:
          LogDriver: json-file
          Options:
            max-size: 10m

  # Fargate offers a fixed set of Cpu values, so a padded spelling names none of
  # them even though it reads as the same number.
  PaddedCpuUnits:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: padded-cpu-units
      RequiresCompatibilities:
      - FARGATE
      NetworkMode: awsvpc
      Cpu: "0512"
      Memory: "1024"
      ContainerDefinitions:
      - Name: app
        Image: nginx
        Essential: true

  # A conditional placement that keeps constraints in one branch still pins
  # placement whenever that branch applies.
  ConditionallyPinnedPlacement:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: conditionally-pinned-placement
      RequiresCompatibilities:
      - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      PlacementConstraints: !If
      - PinPlacement
      - - Type: memberOf
          Expression: attribute:ecs.instance-type =~ t2.*
      - !Ref AWS::NoValue
      ContainerDefinitions:
      - Name: app
        Image: nginx
        Essential: true
