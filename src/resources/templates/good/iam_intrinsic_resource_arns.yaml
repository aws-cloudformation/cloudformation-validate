AWSTemplateFormatVersion: "2010-09-09"
Description: Identity-policy Resource values produced by intrinsics remain opaque to static content checks.
Parameters:
  PolicyResource:
    Type: String
    Default: not-an-arn
Resources:
  SomeBucket:
    Type: AWS::S3::Bucket
  # Fn::Sub referencing only pseudo-parameters resolves to a wrong-service ARN
  # at analysis time; comparing that synthesized value would be a false positive.
  SubFullyResolved:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: sub-resolved
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "cloudformation:CreateStack"
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:x"
      Roles:
        - some-role
  # Fn::GetAtt-valued Resource is opaque to the action-format check.
  GetAttResource:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: getatt
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "cloudformation:CreateStack"
            Resource:
              - !GetAtt SomeBucket.Arn
      Roles:
        - some-role

  JoinResource:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: joined-resource
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: Allow
          Action: s3:GetObject
          Resource: !Join ["/", [!Ref PolicyResource, "*"]]
      Roles:
      - some-role
