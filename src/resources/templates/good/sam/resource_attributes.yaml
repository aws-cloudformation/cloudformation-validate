Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Runtime: python3.12
    Handler: index.handler
Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
  Function:
    Type: AWS::Serverless::Function
    IgnoreGlobals:
    - Runtime
    Connectors:
      TableWrite:
        Properties:
          Destination:
            Id: Table
          Permissions:
          - Write
    Properties:
      Runtime: python3.12
      InlineCode: |
        def handler(event, context):
            return {}
