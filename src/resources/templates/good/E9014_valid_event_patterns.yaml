AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Event patterns that EventBridge accepts, including every matcher shape the
  service documents, and patterns whose values are only known at deployment.
Parameters:
  EventSources:
    Type: CommaDelimitedList
    Default: aws.ec2,aws.s3
  Stage:
    Type: String
    AllowedValues: [prod, dev]
Conditions:
  IsProd: !Equals [!Ref Stage, prod]
Resources:
  Topic:
    Type: AWS::SNS::Topic
  MatcherShapesRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        source: [example.app]
        resources: [!Ref Topic]
        detail:
          name: [{prefix: order-}, {suffix: .png}, "exact"]
          caseless: [{prefix: {equals-ignore-case: ORDER-}}, {suffix: {equals-ignore-case: .PNG}}]
          state: [{anything-but: stopped}]
          region: [{anything-but: [us-west-1, us-west-2]}]
          bucket: [{anything-but: {prefix: tmp-}}, {anything-but: {wildcard: ["*.log", "*.tmp"]}}]
          price: [{numeric: [">", 0, "<=", 100]}, {numeric: [">=", 5]}]
          error: [{exists: false}]
          output: [{exists: true}]
          ip: [{cidr: 10.0.0.0/24}]
          title: [{equals-ignore-case: Report}]
          path: [{wildcard: "a*b"}]
  NestedOrRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        source: [example.app]
        detail:
          $or:
            - x: ["1"]
            - y: ["2"]
  TopLevelOrRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        $or:
          - source: [example.app]
          - detail-type: [Order Placed]
  JsonStringRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern: '{"source": ["example.app"], "detail": {"size": [{"numeric": [">", 1]}]}}'
  ParameterListRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        source: !Ref EventSources
  SubstitutedStringRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern: !Sub '{"source": ["${AWS::StackName}"]}'
  ConditionalValueRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        source: !If [IsProd, [example.app], [example.dev]]
  ReferencedOperandRule:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      EventPattern:
        detail:
          topic: [{prefix: !Ref Topic}, {anything-but: !GetAtt Topic.TopicName}]
  Bus:
    Type: AWS::Events::EventBus
    Properties:
      Name: valid-event-pattern-bus
  ValidArchive:
    Type: AWS::Events::Archive
    Properties:
      SourceArn: !GetAtt Bus.Arn
      EventPattern:
        source: [example.app]
