AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Synthesized with analyticsReporting disabled, so no AWS::CDK::Metadata
  resource exists and the construct-path metadata is the only CDK marker. The
  resources lack Context and one block has no rationale, yet no Context
  diagnostic may fire: the author wrote constructs, not these resources.
Resources:
  OrderQueue:
    Type: AWS::SQS::Queue
    Metadata:
      aws:cdk:path: OrdersStack/OrderQueue/Resource
  OrderTopic:
    Type: AWS::SNS::Topic
    Metadata:
      aws:cdk:path: OrdersStack/OrderTopic/Resource
      com.aws.cloudformation.Context:
        must:
          - "At least one subscriber"
