AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  Env:
    Type: String
  Region:
    Type: String
Conditions:
  IsProd:
    Fn::Equals:
      - !Ref Env
      - prod
  IsUsEast:
    Fn::Equals:
      - !Ref Region
      - us-east-1
  BothProdAndUsEast:
    Fn::And:
      - !Condition IsProd
      - !Condition IsUsEast
  EitherProdOrUsEast:
    Fn::Or:
      - !Condition IsProd
      - !Condition IsUsEast
  NotProd:
    Fn::Not:
      - !Condition IsProd
  TripleAnd:
    Fn::And:
      - !Condition IsProd
      - !Condition IsUsEast
      - !Condition NotProd
  TenOr:
    Fn::Or:
      - !Condition IsProd
      - !Condition IsUsEast
      - !Condition NotProd
      - !Condition IsProd
      - !Condition IsUsEast
      - !Condition NotProd
      - !Condition IsProd
      - !Condition IsUsEast
      - !Condition NotProd
      - !Condition IsProd
Resources:
  Bucket:
    Type: AWS::S3::Bucket
