AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  Env:
    Type: String
    AllowedValues:
      - prod
      - dev
  Region:
    Type: String
Conditions:
  IsProd:
    !Equals [!Ref Env, "prod"]
  IsDev:
    !Equals [!Ref Env, "dev"]
  IsUsEast:
    !Equals [!Ref Region, "us-east-1"]
  IsProdInUsEast:
    !And
      - !Condition IsProd
      - !Condition IsUsEast
Resources:
  ProdBucket:
    Type: AWS::S3::Bucket
    Condition: IsProdInUsEast
