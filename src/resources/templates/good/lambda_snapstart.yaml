AWSTemplateFormatVersion: "2010-09-09"
Resources:
  SnapStartFunc:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: snap-good
      Runtime: java21
      Handler: com.example.Handler
      Role: arn:aws:iam::123456789012:role/lambda-role
      Code:
        S3Bucket: my-bucket
        S3Key: code.zip
      SnapStart:
        ApplyOn: PublishedVersions
