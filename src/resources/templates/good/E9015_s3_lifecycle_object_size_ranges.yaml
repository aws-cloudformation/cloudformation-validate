AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lifecycle object size ranges that are not provably empty, for both general
  purpose and directory buckets: ascending bounds, ascending bounds whose
  strings sort in descending order, a single bound, and bounds that are only
  known at deployment.
Parameters:
  MaxObjectSize:
    Type: Number
    Default: 100
  Stage:
    Type: String
    AllowedValues: [prod, dev]
Conditions:
  IsProd: !Equals [!Ref Stage, prod]
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: AscendingBounds
            Status: Enabled
            ExpirationInDays: 30
            ObjectSizeGreaterThan: "999"
            ObjectSizeLessThan: "1000"
          - Id: AscendingStringBounds
            Status: Enabled
            ExpirationInDays: 30
            ObjectSizeGreaterThan: "1048576"
            ObjectSizeLessThan: "10485760"
          - Id: LowerBoundOnly
            Status: Enabled
            ExpirationInDays: 30
            ObjectSizeGreaterThan: "1000"
          - Id: UpperBoundOnly
            Status: Enabled
            ExpirationInDays: 30
            ObjectSizeLessThan: "1000"
          - Id: ParameterBound
            Status: Enabled
            ExpirationInDays: 30
            ObjectSizeGreaterThan: "1000"
            ObjectSizeLessThan: !Ref MaxObjectSize
  DirectoryBucket:
    Type: AWS::S3Express::DirectoryBucket
    Properties:
      DataRedundancy: SingleAvailabilityZone
      LocationName: use1-az4
      LifecycleConfiguration:
        Rules:
          - Id: AscendingBounds
            Status: Enabled
            ExpirationInDays: 30
            ObjectSizeGreaterThan: "999"
            ObjectSizeLessThan: "1000"
          - Id: AscendingStringBounds
            Status: Enabled
            ExpirationInDays: 30
            ObjectSizeGreaterThan: "1048576"
            ObjectSizeLessThan: "10485760"
          - Id: LowerBoundOnly
            Status: Enabled
            ExpirationInDays: 30
            ObjectSizeGreaterThan: "1000"
          - Id: UpperBoundOnly
            Status: Enabled
            ExpirationInDays: 30
            ObjectSizeLessThan: "1000"
          - Id: ParameterBound
            Status: Enabled
            ExpirationInDays: 30
            ObjectSizeGreaterThan: "1000"
            ObjectSizeLessThan: !Ref MaxObjectSize
          - Id: ConditionalBound
            Status: Enabled
            ExpirationInDays: 30
            ObjectSizeGreaterThan: "1000"
            ObjectSizeLessThan: !If [IsProd, "500", "2000"]
