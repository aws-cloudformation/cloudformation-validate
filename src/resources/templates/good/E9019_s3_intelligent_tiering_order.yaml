AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Intelligent-Tiering configurations whose deep archive tier comes after the
  archive tier, a single tier, and a day count only known at deployment.
Parameters:
  DeepArchiveDays:
    Type: Number
    Default: 180
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      IntelligentTieringConfigurations:
        - Id: Ordered
          Status: Enabled
          Tierings:
            - AccessTier: ARCHIVE_ACCESS
              Days: 179
            - AccessTier: DEEP_ARCHIVE_ACCESS
              Days: 180
        - Id: ArchiveOnly
          Status: Enabled
          Tierings:
            - AccessTier: ARCHIVE_ACCESS
              Days: 365
        - Id: ParameterDays
          Status: Enabled
          Tierings:
            - AccessTier: ARCHIVE_ACCESS
              Days: 365
            - AccessTier: DEEP_ARCHIVE_ACCESS
              Days: !Ref DeepArchiveDays
