AWSTemplateFormatVersion: "2010-09-09"
# F2002 parity exercise: AWS::SSM::Parameter::Name is a valid type (per cfn-lint and
# AWS docs). Neither engine should emit F2002.
Parameters:
  SsmParamName:
    Type: AWS::SSM::Parameter::Name
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SsmParamName
