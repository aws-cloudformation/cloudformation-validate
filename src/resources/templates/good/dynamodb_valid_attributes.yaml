AWSTemplateFormatVersion: "2010-09-09"
Resources:
  GoodTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: good-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
