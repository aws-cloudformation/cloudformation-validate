AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lifecycle transitions that move down the storage-class waterfall and keep
  objects in each class for its minimum storage duration, ascending day counts
  whose strings sort in descending order, and transition day counts that are
  only known at deployment.
Parameters:
  ArchiveDays:
    Type: Number
    Default: 31
  Stage:
    Type: String
    AllowedValues: [prod, dev]
Conditions:
  IsProd: !Equals [!Ref Stage, prod]
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: InfrequentAccessThenGlacier
            Status: Enabled
            ExpirationInDays: 61
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER
                TransitionInDays: 60
          - Id: InstantRetrievalThenDeepArchive
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 30
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 120
          - Id: AscendingDaysInDescendingStringOrder
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: "90"
              - StorageClass: GLACIER
                TransitionInDays: "180"
          - Id: ParameterDays
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER
                TransitionInDays: !Ref ArchiveDays
          - Id: ConditionalDays
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER
                TransitionInDays: !If [IsProd, 10, 365]
