AWSTemplateFormatVersion: "2010-09-09"
Description: Template derived from custom ignore-filter cases, using valid CloudFormation substitutions
Parameters:
  Stage:
    Type: String
Resources:
  TestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "TestRole-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: TestBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${Stage}-bucket/*"
