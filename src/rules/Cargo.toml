[package]
name = "rules"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "rules"
path = "src/lib.rs"

[features]
wasm-bindings = ["dep:tsify", "dep:wasm-bindgen"]
uniffi-bindings = ["dep:uniffi"]

[dependencies]
serde = { version = "1", features = ["derive"] }
regex = "1"
fancy-regex = "0.18"
log = "0.4"
tsify = { version = "0.4", optional = true, features = ["js"] }
wasm-bindgen = { version = "0.2", optional = true }
uniffi = { git = "https://github.com/mozilla/uniffi-rs", branch = "main", optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
