[bindings.kotlin]
package_name = "software.amazon.cloudformation.validate"
generate_immutable_records = true
disable_java_cleaner = true # java.lang.ref.Cleaner is JDK 9+; the jar targets Java 8

[bindings.kotlin.external_packages]
diagnostics = "software.amazon.cloudformation.validate.diagnostics"
rules = "software.amazon.cloudformation.validate.rules"
template_model = "software.amazon.cloudformation.validate.templatemodel"
validation_engine = "software.amazon.cloudformation.validate.engine"
schema_validator = "software.amazon.cloudformation.validate.schemavalidator"
