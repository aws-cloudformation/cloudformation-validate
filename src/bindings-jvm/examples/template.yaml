AWSTemplateFormatVersion: "2010-09-09"
Description: Minimal example stack — an S3 bucket and a security group

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: my-example-bucket

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound web traffic
      SecurityGroupIngress:
        # Opening SSH (port 22) to the world triggers a WARN diagnostic.
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
