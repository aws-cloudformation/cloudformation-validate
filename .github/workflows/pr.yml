name: Pull Request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
