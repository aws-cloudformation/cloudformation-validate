name: Release Merged Data Sync
run-name: Check for a merged data sync release

on:
  schedule: [{ cron: '0 * * * *' }]
  workflow_dispatch:

concurrency:
  group: data-sync-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch-release:
    if: github.repository == 'aws-cloudformation/cloudformation-validate'
    runs-on: ubuntu-latest
    steps:
      - name: Find the latest merged data sync PR
        id: merged-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merged_pr="$(
            gh api \
              --paginate \
              --slurp \
              "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" \
              | jq -cr \
                --arg repository "$GITHUB_REPOSITORY" \
                '[.[][] | select(.merged_at != null and .head.repo.full_name == $repository and (.head.ref | startswith("automated/data-sync-")))] | sort_by(.merged_at) | last // empty'
          )"
          if [ -z "$merged_pr" ]; then
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo 'No merged data sync PR is awaiting release.'
            exit 0
          fi

          base_branch="$(jq -er '.base.ref' <<< "$merged_pr")"
          head_branch="$(jq -er '.head.ref' <<< "$merged_pr")"
          if [[ ! "$base_branch" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest merged data sync PR targets unexpected branch $base_branch."
            exit 1
          fi
          if [[ ! "$head_branch" =~ ^automated/data-sync-[0-9]+\.[0-9]+\.[0-9]+-([0-9]+)$ ]]; then
            echo "::error::Latest merged data sync PR has unexpected head branch $head_branch."
            exit 1
          fi
          {
            echo 'found=true'
            echo "base-branch=$base_branch"
            echo "head-branch=$head_branch"
            echo "head-commit=$(jq -er '.head.sha' <<< "$merged_pr")"
            echo "merge-commit=$(jq -er '.merge_commit_sha' <<< "$merged_pr")"
            echo "pr-number=$(jq -er '.number' <<< "$merged_pr")"
            echo "sync-run-id=${BASH_REMATCH[1]}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the merged patch release and dispatch publication
        if: steps.merged-pr.outputs.found == 'true'
        env:
          BASE_BRANCH: ${{ steps.merged-pr.outputs.base-branch }}
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT: ${{ steps.merged-pr.outputs.merge-commit }}
          PR_HEAD_BRANCH: ${{ steps.merged-pr.outputs.head-branch }}
          PR_HEAD_COMMIT: ${{ steps.merged-pr.outputs.head-commit }}
          PR_NUMBER: ${{ steps.merged-pr.outputs.pr-number }}
          SYNC_RUN_ID: ${{ steps.merged-pr.outputs.sync-run-id }}
        run: |
          set -euo pipefail

          read_repository_file() {
            local path="$1"
            local commit="$2"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/contents/$path?ref=$commit" \
              --jq '.content' \
              | tr -d '\n' \
              | base64 --decode
          }

          release_intent="$(read_repository_file '.github/data-sync-release.json' "$MERGE_COMMIT")"
          cargo_manifest="$(read_repository_file 'src/Cargo.toml' "$MERGE_COMMIT")"
          artifact_source="$(read_repository_file 'release-bin/artifact-source.json' "$MERGE_COMMIT")"
          source_versions_file="$RUNNER_TEMP/source_versions.json"
          read_repository_file \
            'src/data-source/generated/data/source_versions.json' \
            "$MERGE_COMMIT" \
            > "$source_versions_file"

          release_version="$(
            awk '
              $0 == "[workspace.package]" { in_workspace_package = 1; next }
              /^\[/ { in_workspace_package = 0 }
              in_workspace_package && /^version = "/ {
                value = $0
                sub(/^version = "/, "", value)
                sub(/"$/, "", value)
                print value
                exit
              }
            ' <<< "$cargo_manifest"
          )"
          intent_version="$(jq -er '.version' <<< "$release_intent")"
          intent_base_tag="$(jq -er '.base_tag' <<< "$release_intent")"
          intent_branch="$(jq -er '.release_branch' <<< "$release_intent")"
          expected_source_versions_sha256="$(jq -er '.source_versions_sha256' <<< "$release_intent")"
          actual_source_versions_sha256="$(sha256sum "$source_versions_file" | awk '{print $1}')"
          artifact_version="$(jq -er '.version' <<< "$artifact_source")"
          artifact_source_commit="$(jq -er '.source_commit' <<< "$artifact_source")"

          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Workspace version is not a production semantic version: $release_version"
            exit 1
          fi
          if [ "$intent_version" != "$release_version" ] || [ "$artifact_version" != "$release_version" ]; then
            echo "::error::Release intent ($intent_version), artifacts ($artifact_version), and workspace ($release_version) do not agree."
            exit 1
          fi
          expected_head_branch="automated/data-sync-$release_version-$SYNC_RUN_ID"
          if [ "$PR_HEAD_BRANCH" != "$expected_head_branch" ]; then
            echo "::error::Data Sync PR head $PR_HEAD_BRANCH does not match expected branch $expected_head_branch."
            exit 1
          fi
          data_sync_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SYNC_RUN_ID")"
          data_sync_run_path="$(jq -r '.path' <<< "$data_sync_run")"
          data_sync_run_event="$(jq -r '.event' <<< "$data_sync_run")"
          data_sync_run_status="$(jq -r '.status' <<< "$data_sync_run")"
          data_sync_run_conclusion="$(jq -r '.conclusion // ""' <<< "$data_sync_run")"
          data_sync_run_head="$(jq -r '.head_sha' <<< "$data_sync_run")"
          base_tag_commit="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$intent_base_tag" \
            --jq '.sha')"
          if [ "$data_sync_run_path" != '.github/workflows/data-sync.yml' ] \
            || [ "$data_sync_run_event" != 'workflow_dispatch' ] \
            || [ "$data_sync_run_head" != "$base_tag_commit" ]; then
            echo "::error::Data Sync run $SYNC_RUN_ID does not match base tag $intent_base_tag."
            exit 1
          fi
          if [ "$data_sync_run_status" != 'completed' ]; then
            echo "Data Sync run $SYNC_RUN_ID is still $data_sync_run_status; release dispatch will wait."
            exit 0
          fi
          if [ "$data_sync_run_conclusion" != 'success' ]; then
            echo "::error::Data Sync run $SYNC_RUN_ID completed with $data_sync_run_conclusion; refusing to release."
            exit 1
          fi
          if [ "$intent_branch" != "$BASE_BRANCH" ]; then
            echo "::error::Release intent targets $intent_branch, but PR #$PR_NUMBER merged into $BASE_BRANCH."
            exit 1
          fi
          if [ "$actual_source_versions_sha256" != "$expected_source_versions_sha256" ]; then
            echo '::error::Merged source provenance differs from the reviewed release intent.'
            exit 1
          fi
          if [[ ! "$artifact_source_commit" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error::Artifact provenance contains an invalid source commit: $artifact_source_commit"
            exit 1
          fi

          comparison="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$artifact_source_commit...$PR_HEAD_COMMIT" \
            --jq '{status, ahead_by}')"
          comparison_status="$(jq -r '.status' <<< "$comparison")"
          artifact_commit_count="$(jq -r '.ahead_by' <<< "$comparison")"
          if [ "$comparison_status" != 'ahead' ] || [ "$artifact_commit_count" -ne 1 ]; then
            echo "::error::PR head $PR_HEAD_COMMIT must contain exactly one artifact commit after source $artifact_source_commit."
            exit 1
          fi

          merge_tree="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/commits/$MERGE_COMMIT" \
            --jq '.tree.sha')"
          pr_head_tree="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/commits/$PR_HEAD_COMMIT" \
            --jq '.tree.sha')"
          if [ "$merge_tree" != "$pr_head_tree" ]; then
            echo "::error::Merge commit $MERGE_COMMIT does not preserve the reviewed PR head tree $PR_HEAD_COMMIT."
            exit 1
          fi

          write_non_artifact_manifest() {
            local commit="$1"
            local manifest="$2"
            local tree_json="$RUNNER_TEMP/tree-$commit.json"
            gh api \
              "repos/$GITHUB_REPOSITORY/git/trees/$commit?recursive=1" \
              > "$tree_json"
            if ! jq -e '.truncated == false' "$tree_json" >/dev/null; then
              echo "::error::GitHub truncated the recursive tree for $commit; release provenance cannot be verified."
              exit 1
            fi
            jq -r '
              .tree[]
              | select(.type != "tree")
              | select(
                  (.path == "src/THIRD-PARTY-LICENSES.txt") or
                  (.path == "src/bindings-jvm/version.properties") or
                  (.path == "src/bindings-jvm/THIRD-PARTY-LICENSES.txt") or
                  (.path == "src/bindings-wasm/THIRD-PARTY-LICENSES.txt") or
                  (.path == "src/bindings-python/THIRD-PARTY-LICENSES.txt") or
                  (.path == "src/bindings-go/go/README.md") or
                  (.path == "src/bindings-go/go/LICENSE") or
                  (.path == "src/bindings-go/go/THIRD-PARTY-LICENSES.txt") or
                  (.path | startswith("src/bindings-jvm/generated/")) or
                  (.path | startswith("src/bindings-wasm/dist/")) or
                  (.path | startswith("src/bindings-python/generated/dist/")) or
                  (.path | startswith("src/bindings-go/go/internal/")) or
                  (.path | startswith("src/bindings-go/go/libs/")) or
                  (.path | startswith("release-bin/"))
                | not
              )
              | [.path, .mode, .type, .sha]
              | @tsv
            ' "$tree_json" | LC_ALL=C sort > "$manifest"
          }

          artifact_source_manifest="$RUNNER_TEMP/artifact-source.manifest"
          pr_head_source_manifest="$RUNNER_TEMP/pr-head-source.manifest"
          write_non_artifact_manifest "$artifact_source_commit" "$artifact_source_manifest"
          write_non_artifact_manifest "$PR_HEAD_COMMIT" "$pr_head_source_manifest"
          if ! diff -u "$artifact_source_manifest" "$pr_head_source_manifest"; then
            echo '::error::The PR changed source files after its release artifacts were built.'
            exit 1
          fi

          IFS=. read -r base_major base_minor base_patch <<< "$intent_base_tag"
          IFS=. read -r release_major release_minor release_patch <<< "$release_version"
          expected_branch="release/$base_major.$base_minor"
          if [ "$BASE_BRANCH" != "$expected_branch" ] \
            || [ "$release_major" != "$base_major" ] \
            || [ "$release_minor" != "$base_minor" ] \
            || [ "$release_patch" -ne "$((10#$base_patch + 1))" ]; then
            echo "::error::$release_version is not the next patch after $intent_base_tag on $BASE_BRANCH."
            exit 1
          fi

          mapfile -t production_tags < <(
            git ls-remote --refs --tags "https://github.com/$GITHUB_REPOSITORY.git" \
              | awk '{sub("refs/tags/", "", $2); print $2}' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V
          )
          if [ ${#production_tags[@]} -eq 0 ]; then
            echo '::error::No production release tags were found.'
            exit 1
          fi
          latest_index=$((${#production_tags[@]} - 1))
          latest_production_tag="${production_tags[$latest_index]}"
          release_tag_commit="$(
            git ls-remote \
              --refs \
              --tags \
              "https://github.com/$GITHUB_REPOSITORY.git" \
              "refs/tags/$release_version" \
              | awk '{print $1}'
          )"
          if [ -n "$release_tag_commit" ] && [ "$release_tag_commit" != "$MERGE_COMMIT" ]; then
            echo "::error::Tag $release_version points to $release_tag_commit, not merged commit $MERGE_COMMIT."
            exit 1
          fi

          release_runs="$(
            gh api \
              --paginate \
              --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=100" \
              | jq -c \
                --arg prefix "Release $release_version " \
                '[.[] | .workflow_runs[] | select(.display_title | startswith($prefix))] | sort_by(.created_at)'
          )"
          latest_release_run="$(jq -cr 'last // empty' <<< "$release_runs")"
          successful_release_run="$(jq -cr '[.[] | select(.status == "completed" and .conclusion == "success")] | last // empty' <<< "$release_runs")"
          if [ -n "$successful_release_run" ]; then
            successful_release_run_url="$(jq -r '.html_url' <<< "$successful_release_run")"
            if [ -z "$release_tag_commit" ]; then
              echo "::error::Successful release run $successful_release_run_url did not create tag $release_version."
              exit 1
            fi
            echo "Release $release_version already completed successfully: $successful_release_run_url"
            exit 0
          fi
          if [ -n "$latest_release_run" ]; then
            release_run_status="$(jq -r '.status' <<< "$latest_release_run")"
            release_run_conclusion="$(jq -r '.conclusion // ""' <<< "$latest_release_run")"
            release_run_url="$(jq -r '.html_url' <<< "$latest_release_run")"
            if [ "$release_run_status" != 'completed' ]; then
              echo "Release $release_version is already $release_run_status: $release_run_url"
              exit 0
            fi
            if [ "$release_run_conclusion" = 'success' ]; then
              echo "::error::Successful release run $release_run_url was not selected from the release history."
              exit 1
            fi
            if [ "$release_run_conclusion" = 'cancelled' ] || [ "$release_run_conclusion" = 'action_required' ]; then
              echo "Release $release_version ended with $release_run_conclusion; manual release dispatch is required: $release_run_url"
              exit 0
            fi
            failed_release_run_count="$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<< "$release_runs")"
            max_release_attempts=3
            if [ "$failed_release_run_count" -ge "$max_release_attempts" ]; then
              echo "::error::Release $release_version failed $failed_release_run_count times; automatic retries are exhausted."
              exit 1
            fi
            echo "Retrying release $release_version after $release_run_conclusion run $release_run_url."
          elif [ -n "$release_tag_commit" ]; then
            echo "Resuming release $release_version from existing tag at $MERGE_COMMIT."
          fi

          if [ -n "$release_tag_commit" ]; then
            if [ "$latest_production_tag" != "$release_version" ]; then
              echo "::error::Production releases advanced beyond incomplete data sync release $release_version to $latest_production_tag."
              exit 1
            fi
          elif [ "$latest_production_tag" != "$intent_base_tag" ]; then
            echo "::error::Latest production tag advanced from $intent_base_tag to $latest_production_tag before this PR merged."
            exit 1
          fi

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field tag="$release_version" \
            --field ref="$MERGE_COMMIT" \
            --field source-branch="$BASE_BRANCH"
          echo "Dispatched release $release_version from $BASE_BRANCH @ $MERGE_COMMIT."
