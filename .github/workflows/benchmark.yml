name: Benchmark

# Every scenario of scripts/compare_benchmarks.py (built-in rules only, built-in +
# Guard rule pack, built-in + custom Rego rule pack, and both packs) is a full
# engine × binding benchmark and always runs, in one job so every number in the
# report comes from the same runner. The per-template and aggregate reports stay
# on the runner; only the assembled comparison report is uploaded.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per template (positive integer)'
        required: false
        type: number
        default: 50
      top_slowest:
        description: 'Number of slowest templates to report per engine×binding'
        required: false
        type: number
        default: 10
      startup_samples:
        description: 'Startup-probe processes per engine×binding (>= 2; first is cold, rest are warm)'
        required: false
        type: number
        default: 5

  schedule:
    # Weekly: every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v6

    - name: Load build configs
      id: configs
      uses: ./.github/actions/load-configs

    - name: Setup JVM toolchain
      uses: ./.github/actions/setup-jvm-toolchain
      with:
        java-version: ${{ steps.configs.outputs.java-version }}
        java-distribution: ${{ steps.configs.outputs.java-distribution }}
        kotlin-version: ${{ steps.configs.outputs.kotlin-version }}
        ktlint-version: ${{ steps.configs.outputs.ktlint-version }}
        gradle-version: ${{ steps.configs.outputs.gradle-version }}

    - name: Install Rust ${{ steps.configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ steps.configs.outputs.rust-toolchain }}

    - name: Setup Node.js ${{ steps.configs.outputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.configs.outputs.node-version }}
        package-manager-cache: false

    - name: Setup Python ${{ steps.configs.outputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ steps.configs.outputs.python-version }}

    - name: Setup Go ${{ steps.configs.outputs.go-version }}
      uses: actions/setup-go@v6
      with:
        go-version: ${{ steps.configs.outputs.go-version }}
        cache: false

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Verify tool versions match configuration
      shell: bash
      env:
        EXPECTED_PYTHON_VERSION: ${{ steps.configs.outputs.python-version }}
        EXPECTED_GO_VERSION: ${{ steps.configs.outputs.go-version }}
        EXPECTED_JAVA_VERSION: ${{ steps.configs.outputs.java-version }}
      run: |
        set -euo pipefail

        actual_python_version="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
        if [[ "$actual_python_version" != "$EXPECTED_PYTHON_VERSION" ]]; then
          echo "::error::Python version mismatch: expected=$EXPECTED_PYTHON_VERSION actual=$actual_python_version"
          exit 1
        fi

        actual_go_version="$(go env GOVERSION)"
        actual_go_version="${actual_go_version#go}"
        if [[ "$actual_go_version" != "$EXPECTED_GO_VERSION" && "$actual_go_version" != "$EXPECTED_GO_VERSION".* ]]; then
          echo "::error::Go version mismatch: expected=${EXPECTED_GO_VERSION}[.x] actual=$actual_go_version"
          exit 1
        fi

        actual_java_version="$(java -version 2>&1 | awk -F'"' 'NR == 1 { print $2 }')"
        actual_java_major_version="${actual_java_version%%.*}"
        if [[ "$actual_java_major_version" != "$EXPECTED_JAVA_VERSION" ]]; then
          echo "::error::Java version mismatch: expected=$EXPECTED_JAVA_VERSION actual=$actual_java_major_version"
          exit 1
        fi

        echo "Verified tool versions: Python=$actual_python_version Go=$actual_go_version Java=$actual_java_version"

    - name: Run benchmarks
      working-directory: ${{ env.WORKING_DIR }}
      shell: bash
      env:
        BENCHMARK_ITERATIONS: ${{ inputs.iterations }}
        TOP_SLOWEST: ${{ inputs.top_slowest }}
        STARTUP_SAMPLES: ${{ inputs.startup_samples }}
      run: |
        set -euo pipefail

        # Every scenario; the iteration count is applied to all of them.
        benchmark_command=(python3 ../scripts/compare_benchmarks.py)
        if [[ -n "$BENCHMARK_ITERATIONS" ]]; then
          benchmark_command+=(--iterations "$BENCHMARK_ITERATIONS")
        fi

        if [[ -n "$TOP_SLOWEST" ]]; then
          benchmark_command+=(--top-slowest "$TOP_SLOWEST")
        fi

        if [[ -n "$STARTUP_SAMPLES" ]]; then
          benchmark_command+=(--startup-samples "$STARTUP_SAMPLES")
        fi

        "${benchmark_command[@]}"

    - name: Validate aggregates
      shell: bash
      run: |
        set -euo pipefail
        # Validate every aggregate the run must have produced (every scenario × binding
        # × engine the scenario can run): JSON parses, scenario/binding/engine labels
        # match, the rule pack and provenance metadata are present, and the
        # startup/memory enrichment compare_benchmarks.py adds is in place.
        python3 - <<'PY'
        import json
        import sys
        from numbers import Real

        sys.path.insert(0, "scripts")
        import compare_benchmarks as cb

        expected = cb.expected_aggregate_files(cb.SCENARIOS, cb.ENGINES, cb.ALL_BINDINGS)

        def is_num(value):
            return isinstance(value, Real) and not isinstance(value, bool)

        def dig(data, *path):
            cur = data
            for key in path:
                if not isinstance(cur, dict) or key not in cur:
                    return None
                cur = cur[key]
            return cur

        errors = []
        for exp_scenario, exp_binding, exp_engine, fpath in expected:
            scenario = cb.scenario_by_id(exp_scenario)
            try:
                with open(fpath) as handle:
                    data = json.load(handle)
            except (OSError, json.JSONDecodeError) as exc:
                errors.append(f"{fpath}: cannot read/parse ({exc})")
                continue
            if data.get("scenario") != exp_scenario:
                errors.append(f"{fpath}: scenario={data.get('scenario')!r} expected {exp_scenario!r}")
            if data.get("binding") != exp_binding:
                errors.append(f"{fpath}: binding={data.get('binding')!r} expected {exp_binding!r}")
            if data.get("engine") != exp_engine:
                errors.append(f"{fpath}: engine={data.get('engine')!r} expected {exp_engine!r}")
            if not isinstance(data.get("rules_fingerprint"), str) or not data.get("rules_fingerprint"):
                errors.append(f"{fpath}: missing rules_fingerprint")
            guard_files = dig(data, "custom_rules", "guard", "files")
            rego_files = dig(data, "custom_rules", "rego", "files")
            if not is_num(guard_files) or not is_num(rego_files):
                errors.append(f"{fpath}: missing custom_rules.guard.files / custom_rules.rego.files")
            elif scenario["guard"] and guard_files == 0:
                errors.append(f"{fpath}: scenario loads the Guard pack but custom_rules.guard.files is 0")
            elif scenario["rego"] and rego_files == 0:
                errors.append(f"{fpath}: scenario loads the Rego pack but custom_rules.rego.files is 0")
            if not dig(data, "provenance", "cloudformation_validate"):
                errors.append(f"{fpath}: missing provenance.cloudformation_validate")
            if not is_num(dig(data, "performance", "startup", "consumer_init", "duration_ms")):
                errors.append(f"{fpath}: missing performance.startup.consumer_init.duration_ms")
            if not is_num(dig(data, "performance", "startup", "first_validation", "host_ms")):
                errors.append(f"{fpath}: missing performance.startup.first_validation.host_ms")
            for field in ("consumer_init_ms", "first_validation_host_ms", "process_wall_ms", "process_peak_rss_bytes"):
                if not is_num(dig(data, "process_startup", "cold", field)):
                    errors.append(f"{fpath}: missing process_startup.cold.{field}")
            if not isinstance(dig(data, "process_startup", "warm"), dict):
                errors.append(f"{fpath}: missing process_startup.warm")
            if not is_num(dig(data, "memory", "full_corpus_peak_rss_bytes")):
                errors.append(f"{fpath}: missing memory.full_corpus_peak_rss_bytes")

        if errors:
            print(f"::error::{len(errors)} error(s) validating aggregate files")
            for err in errors:
                print(f"  - {err}")
            sys.exit(1)
        print(f"All {len(expected)} aggregate files validated "
              "(labels, rule pack, provenance, startup, memory)")
        PY

    - name: Upload comparison report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-comparison
        path: scripts/snapshots/benchmark_comparison.md
        if-no-files-found: warn
        retention-days: 90
