name: Benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per template (positive integer)'
        required: false
        type: number
        default: 50
      top_slowest:
        description: 'Number of slowest templates to report per engine×binding'
        required: false
        type: number
        default: 10
      startup_samples:
        description: 'Startup-probe processes per engine×binding (>= 2; first is cold, rest are warm)'
        required: false
        type: number
        default: 5

  schedule:
    # Weekly: every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-configs:
    uses: ./.github/workflows/configs.yml

  benchmark:
    needs: [ get-configs ]
    runs-on: ubuntu-latest
    env:
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
    - uses: actions/checkout@v6

    - name: Setup JVM toolchain
      uses: ./.github/actions/setup-jvm-toolchain
      with:
        java-version: ${{ needs.get-configs.outputs.java-version }}
        java-distribution: ${{ needs.get-configs.outputs.java-distribution }}
        kotlin-version: ${{ needs.get-configs.outputs.kotlin-version }}
        ktlint-version: ${{ needs.get-configs.outputs.ktlint-version }}
        gradle-version: ${{ needs.get-configs.outputs.gradle-version }}

    - name: Install Rust ${{ needs.get-configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ needs.get-configs.outputs.rust-toolchain }}
        targets: wasm32-unknown-unknown

    - name: Setup Node.js ${{ needs.get-configs.outputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ needs.get-configs.outputs.node-version }}

    - name: Install wasm-pack ${{ needs.get-configs.outputs.wasm-pack-version }}
      uses: taiki-e/install-action@v2.86.7
      with:
        tool: wasm-pack@${{ needs.get-configs.outputs.wasm-pack-version }}

    - name: Setup Python ${{ needs.get-configs.outputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ needs.get-configs.outputs.python-version }}

    - name: Setup Go ${{ needs.get-configs.outputs.go-version }}
      uses: actions/setup-go@v6
      with:
        go-version: ${{ needs.get-configs.outputs.go-version }}

    - name: Install uniffi-bindgen-go ${{ needs.get-configs.outputs.uniffi-bindgen-go-tag }}
      run: cargo install uniffi-bindgen-go --git https://github.com/NordSecurity/uniffi-bindgen-go --tag '${{ needs.get-configs.outputs.uniffi-bindgen-go-tag }}'

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Verify tool versions match configuration
      shell: bash
      env:
        EXPECTED_PYTHON_VERSION: ${{ needs.get-configs.outputs.python-version }}
        EXPECTED_GO_VERSION: ${{ needs.get-configs.outputs.go-version }}
        EXPECTED_JAVA_VERSION: ${{ needs.get-configs.outputs.java-version }}
      run: |
        set -euo pipefail

        actual_python_version="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
        if [[ "$actual_python_version" != "$EXPECTED_PYTHON_VERSION" ]]; then
          echo "::error::Python version mismatch: expected=$EXPECTED_PYTHON_VERSION actual=$actual_python_version"
          exit 1
        fi

        actual_go_version="$(go env GOVERSION)"
        actual_go_version="${actual_go_version#go}"
        if [[ "$actual_go_version" != "$EXPECTED_GO_VERSION" && "$actual_go_version" != "$EXPECTED_GO_VERSION".* ]]; then
          echo "::error::Go version mismatch: expected=${EXPECTED_GO_VERSION}[.x] actual=$actual_go_version"
          exit 1
        fi

        actual_java_version="$(java -version 2>&1 | awk -F'"' 'NR == 1 { print $2 }')"
        actual_java_major_version="${actual_java_version%%.*}"
        if [[ "$actual_java_major_version" != "$EXPECTED_JAVA_VERSION" ]]; then
          echo "::error::Java version mismatch: expected=$EXPECTED_JAVA_VERSION actual=$actual_java_major_version"
          exit 1
        fi

        echo "Verified tool versions: Python=$actual_python_version Go=$actual_go_version Java=$actual_java_version"

    - name: Run benchmarks
      working-directory: ${{ env.WORKING_DIR }}
      shell: bash
      env:
        BENCHMARK_ITERATIONS: ${{ inputs.iterations }}
        TOP_SLOWEST: ${{ inputs.top_slowest }}
        STARTUP_SAMPLES: ${{ inputs.startup_samples }}
      run: |
        set -euo pipefail

        benchmark_command=(python3 ../scripts/compare_benchmarks.py)
        if [[ -n "$BENCHMARK_ITERATIONS" ]]; then
          benchmark_command+=(--iterations "$BENCHMARK_ITERATIONS")
        fi

        if [[ -n "$TOP_SLOWEST" ]]; then
          benchmark_command+=(--top-slowest "$TOP_SLOWEST")
        fi

        if [[ -n "$STARTUP_SAMPLES" ]]; then
          benchmark_command+=(--startup-samples "$STARTUP_SAMPLES")
        fi

        "${benchmark_command[@]}"

    - name: Validate aggregates
      working-directory: ${{ env.WORKING_DIR }}
      shell: bash
      run: |
        set -euo pipefail
        # Validate all 10 aggregate files (5 bindings × 2 engines): JSON parses,
        # binding/engine labels match, and the enriched provenance/startup/memory
        # contract produced by compare_benchmarks.py is present.
        python3 - <<'PY'
        import json
        import sys
        from numbers import Real

        EXPECTED = [
            ("native", "rego", "cfn-validate/reports/rego/aggregate_detailed.json"),
            ("native", "cel", "cfn-validate/reports/cel/aggregate_detailed.json"),
            ("wasm", "rego", "bindings-wasm/reports/rego/aggregate_detailed.json"),
            ("wasm", "cel", "bindings-wasm/reports/cel/aggregate_detailed.json"),
            ("jvm", "rego", "bindings-jvm/reports/rego/aggregate_detailed.json"),
            ("jvm", "cel", "bindings-jvm/reports/cel/aggregate_detailed.json"),
            ("python", "rego", "bindings-python/reports/rego/aggregate_detailed.json"),
            ("python", "cel", "bindings-python/reports/cel/aggregate_detailed.json"),
            ("go", "rego", "bindings-go/reports/rego/aggregate_detailed.json"),
            ("go", "cel", "bindings-go/reports/cel/aggregate_detailed.json"),
        ]

        def is_num(value):
            return isinstance(value, Real) and not isinstance(value, bool)

        def dig(data, *path):
            cur = data
            for key in path:
                if not isinstance(cur, dict) or key not in cur:
                    return None
                cur = cur[key]
            return cur

        errors = []
        for exp_binding, exp_engine, fpath in EXPECTED:
            try:
                with open(fpath) as handle:
                    data = json.load(handle)
            except (OSError, json.JSONDecodeError) as exc:
                errors.append(f"{fpath}: cannot read/parse ({exc})")
                continue
            if data.get("binding") != exp_binding:
                errors.append(f"{fpath}: binding={data.get('binding')!r} expected {exp_binding!r}")
            if data.get("engine") != exp_engine:
                errors.append(f"{fpath}: engine={data.get('engine')!r} expected {exp_engine!r}")
            if not dig(data, "provenance", "cloudformation_validate"):
                errors.append(f"{fpath}: missing provenance.cloudformation_validate")
            if not is_num(dig(data, "performance", "startup", "consumer_init", "duration_ms")):
                errors.append(f"{fpath}: missing performance.startup.consumer_init.duration_ms")
            if not is_num(dig(data, "performance", "startup", "first_validation", "host_ms")):
                errors.append(f"{fpath}: missing performance.startup.first_validation.host_ms")
            for field in ("consumer_init_ms", "first_validation_host_ms", "process_wall_ms", "process_peak_rss_bytes"):
                if not is_num(dig(data, "process_startup", "cold", field)):
                    errors.append(f"{fpath}: missing process_startup.cold.{field}")
            if not isinstance(dig(data, "process_startup", "warm"), dict):
                errors.append(f"{fpath}: missing process_startup.warm")
            if not is_num(dig(data, "memory", "full_corpus_peak_rss_bytes")):
                errors.append(f"{fpath}: missing memory.full_corpus_peak_rss_bytes")

        if errors:
            print(f"::error::{len(errors)} error(s) validating aggregate files")
            for err in errors:
                print(f"  - {err}")
            sys.exit(1)
        print(f"All {len(EXPECTED)} aggregate files validated "
              "(labels, provenance, startup, memory)")
        PY

    - name: Upload comparison report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-comparison
        path: scripts/snapshots/benchmark_comparison.md
        if-no-files-found: warn
