name: Release
run-name: Release ${{ inputs.tag }} from ${{ inputs.branch }} ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release (1.0.0 for prod, 1.0.0-beta for beta)"
        required: true
        type: string
      branch:
        description: "Branch to release from — main for regular releases, a hotfix branch for patch releases."
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  get-configs:
    uses: ./.github/workflows/configs.yml

  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.branch }}
      fail-fast: true

  version-and-tag:
    needs: [ get-configs, validate ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Log release commit
        env:
          BRANCH: ${{ inputs.branch }}
        run: echo "Releasing from branch $BRANCH, commit $(git rev-parse HEAD)"

      - name: Get version from Cargo.toml
        id: get-version
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "Cargo.toml version = $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches version
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          TAG="${{ inputs.tag }}"

          if [[ "$TAG" == "$VERSION" ]]; then
            echo "Tag $TAG matches version $VERSION - prod release"
          elif [[ "$TAG" == "$VERSION-beta" ]]; then
            echo "Tag $TAG matches version $VERSION - beta release"
          else
            echo "::error::Tag ($TAG) must be $VERSION (prod) or $VERSION-beta (beta)"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git rev-parse -q --verify "refs/tags/${{ inputs.tag }}" >/dev/null; then
            echo "::error::Tag ${{ inputs.tag }} already exists."
            exit 1
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          git tag "${{ inputs.tag }}"
          echo "Created tag from branch=$(git rev-parse --abbrev-ref HEAD), commit=$(git rev-parse HEAD), tag=$(git describe --tags --exact-match)"

          git push origin "${{ inputs.tag }}"
          echo "Pushed tag=$TAG"

  release:
    needs: [ get-configs, version-and-tag ]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Assemble release artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release

          jar="$WORKING_DIR/bindings-jvm/generated/cloudformation-validate.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::Missing $jar. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          cp "$jar" "release/cloudformation-validate-${{ inputs.tag }}.jar"

          if [ ! -d "$WORKING_DIR/bindings-wasm/dist" ]; then
            echo "::error::bindings-wasm/dist not found. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi

          WASM_PKG_JSON="$WORKING_DIR/bindings-wasm/dist/package.json"
          if [ ! -f "$WASM_PKG_JSON" ]; then
            echo "::error::$WASM_PKG_JSON not found in committed dist."
            exit 1
          fi
          tmp=$(mktemp)
          jq --arg v "${{ inputs.tag }}" '.version = $v' "$WASM_PKG_JSON" > "$tmp"
          mv "$tmp" "$WASM_PKG_JSON"
          echo "WASM package version stamped to ${{ inputs.tag }}:"
          grep '"version"' "$WASM_PKG_JSON"

          ( cd "$WORKING_DIR/bindings-wasm" && zip -r "$GITHUB_WORKSPACE/release/cloudformation-validate-wasm-${{ inputs.tag }}.zip" dist )

          wheels=("$WORKING_DIR"/bindings-python/generated/dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "::error::Expected exactly one wheel in $WORKING_DIR/bindings-python/generated/dist/, found ${#wheels[@]}. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          release_version="${{ inputs.tag }}"
          release_version="${release_version#v}"
          release_version="${release_version%-beta}"
          case "$(basename "${wheels[0]}")" in
            cloudformation_validate-"$release_version"-*.whl) ;;
            *)
              echo "::error::Committed wheel $(basename "${wheels[0]}") is not version $release_version. Run the Build Artifacts workflow and merge its PR first."
              exit 1
              ;;
          esac
          # A beta tag ships as the pre-release <version>b0.
          wheel_version="$release_version"
          case "${{ inputs.tag }}" in
            *-beta) wheel_version="${release_version}b0" ;;
          esac
          "$WORKING_DIR/bindings-python/stamp-wheel.py" release "${wheels[0]}" "$wheel_version"

          if [ ! -f "$WORKING_DIR/bindings-go/go/go.mod" ]; then
            echo "::error::$WORKING_DIR/bindings-go/go/go.mod not found. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          go_libraries=("$WORKING_DIR"/bindings-go/go/libs/*/libbindings_go.a)
          if [ ${#go_libraries[@]} -eq 0 ]; then
            echo "::error::No static libraries in $WORKING_DIR/bindings-go/go/libs/. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          ( cd "$WORKING_DIR/bindings-go" && zip -r "$GITHUB_WORKSPACE/release/cloudformation-validate-go-${{ inputs.tag }}.zip" go )

          binaries=("$GITHUB_WORKSPACE"/release-bin/cfn-validate-*)
          if [ ${#binaries[@]} -eq 0 ]; then
            echo "::error::No cfn-validate binaries found in $GITHUB_WORKSPACE/release-bin/. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          for bin in "${binaries[@]}"; do
            name="$(basename "$bin")"
            platform="${name#cfn-validate-}"
            extension=""
            case "$platform" in
              *.exe) platform="${platform%.exe}"; extension=".exe" ;;
            esac
            cp "$bin" "release/cfn-validate-${{ inputs.tag }}-${platform}${extension}"
          done

          ls -lh release/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.SIGNING_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sign artifacts with KMS
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in release/*; do
            rm -f digest.bin
            openssl dgst -sha256 -binary "$f" > digest.bin

            aws kms sign \
              --region "${{ secrets.AWS_REGION }}" \
              --key-id "${{ secrets.KMS_KEY_ALIAS }}" \
              --message fileb://digest.bin \
              --message-type DIGEST \
              --signing-algorithm RSASSA_PKCS1_V1_5_SHA_256 \
              --query Signature --output text | base64 -d > "$f.sig"

            echo "signed: $f -> $f.sig"
          done
          rm -f digest.bin

      - name: Verify signatures
        env:
          SIGNING_PUBLIC_KEY: ${{ secrets.SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          printf '%s\n' "$SIGNING_PUBLIC_KEY" > signing-key.pem

          for f in release/*; do
            case "$f" in *.sig) continue ;; esac
            echo "Verifying: $f"
            result=$(openssl dgst -sha256 -verify signing-key.pem -signature "$f.sig" "$f") || true
            echo "$result"
            if [ "$result" != "Verified OK" ]; then
              echo "::error::signature verification failed for $f"
              exit 1
            fi
          done
          rm -f signing-key.pem

      - name: Add GitHub public key
        env:
          SIGNING_PUBLIC_KEY: ${{ secrets.SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SIGNING_PUBLIC_KEY" > release/signing-key.pem
          fingerprint=$(openssl pkey -pubin -in release/signing-key.pem -outform DER | openssl dgst -sha256 | awk '{print $NF}')
          printf '%s\n' "$fingerprint" > release/signing-key.pem.sha256
          echo "public key SHA-256: $fingerprint"

      - name: Configure AWS credentials for Maven signing
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.MAVEN_SIGNING_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Add Maven PGP public key
        run: |
          set -euo pipefail
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id "${{ secrets.MAVEN_GPG_PUBLIC_ID }}" --query SecretString --output text)"
          key="release/cloudformation-validate-maven-signing-key.asc"
          printf '%s' "$secret_json" | jq -r '.publicKey'  > "$key"
          printf '%s' "$secret_json" | jq -r '.fingerprint' > "$key.fingerprint"
          echo "Maven PGP public key fingerprint: $(cat "$key.fingerprint")"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ contains(inputs.tag, '-beta') }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true

  publish-maven:
    needs: [ get-configs, version-and-tag, release ]
    runs-on: ubuntu-latest
    environment: release-maven
    permissions:
      contents: read
      id-token: write
    env:
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Setup JVM toolchain
        uses: ./.github/actions/setup-jvm-toolchain
        with:
          java-version: ${{ needs.get-configs.outputs.java-version }}
          java-distribution: ${{ needs.get-configs.outputs.java-distribution }}
          kotlin-version: ${{ needs.get-configs.outputs.kotlin-version }}
          ktlint-version: ${{ needs.get-configs.outputs.ktlint-version }}
          gradle-version: ${{ needs.get-configs.outputs.gradle-version }}

      - name: Verify committed jar is present and multi-platform
        working-directory: ${{ env.WORKING_DIR }}/bindings-jvm
        run: |
          set -euo pipefail
          jar="generated/cloudformation-validate.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::Missing $jar. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          for prefix in linux-x86-64 darwin-aarch64 win32-x86-64; do
            if ! unzip -Z1 "$jar" | grep -q "^$prefix/"; then
              echo "::error::native library for $prefix missing from committed jar; the all-platform merge did not run"
              exit 1
            fi
          done
          if ! unzip -Z1 "$jar" | grep -q '\.class$'; then
            echo "::error::committed jar contains no compiled .class output; the JVM build did not compile"
            exit 1
          fi
          if ! unzip -Z1 "$jar" | grep -q '\.kt$'; then
            echo "::error::committed jar contains no .kt sources; the source bundling step did not run"
            exit 1
          fi
          echo "Committed jar carries all three platform natives plus compiled classes and sources."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.MAVEN_SIGNING_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build signed Central Portal bundle
        working-directory: ${{ env.WORKING_DIR }}/bindings-jvm
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id "${{ secrets.MAVEN_GPG_SECRET_ID }}" --query SecretString --output text)"
          export ORG_GRADLE_PROJECT_signingKey="$(printf '%s' "$secret_json" | jq -r '.privateKey')"
          export ORG_GRADLE_PROJECT_signingPassword="$(printf '%s' "$secret_json" | jq -r '.passphrase')"
          unset secret_json

          ./generate-version-properties.sh "$RELEASE_TAG"
          gradle --no-daemon --console=plain centralBundle
          ls -lh build/central/

      - name: Verify every artifact is signed
        working-directory: ${{ env.WORKING_DIR }}/bindings-jvm
        run: |
          set -euo pipefail
          bundle="$(ls build/central/*-bundle.zip)"
          tmp="$(mktemp -d)"
          unzip -qo "$bundle" -d "$tmp"
          base="$tmp/software/amazon/cloudformation/cloudformation-validate/${{ inputs.tag }}"
          missing=0
          for suffix in .jar -sources.jar -javadoc.jar .pom; do
            f="cloudformation-validate-${{ inputs.tag }}${suffix}"
            for companion in asc md5 sha1; do
              if [ ! -f "$base/$f.$companion" ]; then
                echo "::error::missing $f.$companion in bundle"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] && echo "All artifacts carry .asc/.md5/.sha1." || exit 1

          committed_sha="$(sha256sum generated/cloudformation-validate.jar | awk '{print $1}')"
          bundle_sha="$(sha256sum "$base/cloudformation-validate-${{ inputs.tag }}.jar" | awk '{print $1}')"
          if [ "$committed_sha" != "$bundle_sha" ]; then
            echo "::error::Maven bundle jar ($bundle_sha) differs from the committed jar ($committed_sha) that the GitHub release ships. They must be byte-identical."
            exit 1
          fi
          echo "Maven bundle jar is byte-identical to the committed jar (sha256 $committed_sha)."

      - name: Publish to Central Portal
        working-directory: ${{ env.WORKING_DIR }}/bindings-jvm
        run: |
          set -euo pipefail
          bundle="$(ls build/central/*-bundle.zip)"

          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id "${{ secrets.CENTRAL_PORTAL_SECRET_ID }}" --query SecretString --output text)"
          username="$(printf '%s' "$secret_json" | jq -er '.username')"
          password="$(printf '%s' "$secret_json" | jq -er '.password')"
          token="$(printf '%s:%s' "$username" "$password" | base64 | tr -d '\n')"
          unset secret_json username password

          deployment_id="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@$bundle" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=cloudformation-validate-${{ inputs.tag }}")"
          echo "Central Portal deployment id: $deployment_id"

          max_attempts=60
          for attempt in $(seq 1 "$max_attempts"); do
            status_json="$(curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $token" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$deployment_id")"
            state="$(printf '%s' "$status_json" | jq -r '.deploymentState')"
            echo "attempt $attempt/$max_attempts: deploymentState=$state"

            case "$state" in
              PUBLISHED)
                echo "Deployment published to Maven Central."
                exit 0
                ;;
              PUBLISHING)
                echo "Validation passed; the Portal is publishing to Maven Central."
                exit 0
                ;;
              FAILED)
                echo "::error::Central Portal validation failed for deployment $deployment_id"
                printf '%s\n' "$status_json" | jq .
                exit 1
                ;;
            esac
            sleep 30
          done

          echo "::error::Timed out waiting for Central Portal deployment $deployment_id to validate"
          exit 1

  verify-publish-maven:
    needs: [ publish-maven ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify artifacts resolve from Maven Central
        run: |
          set -euo pipefail
          base="https://repo1.maven.org/maven2/software/amazon/cloudformation/cloudformation-validate/${{ inputs.tag }}"
          files=(
            "cloudformation-validate-${{ inputs.tag }}.pom"
            "cloudformation-validate-${{ inputs.tag }}.jar"
            "cloudformation-validate-${{ inputs.tag }}-sources.jar"
            "cloudformation-validate-${{ inputs.tag }}-javadoc.jar"
          )

          max_attempts=60
          for attempt in $(seq 1 "$max_attempts"); do
            missing=0
            for f in "${files[@]}"; do
              for candidate in "$f" "$f.asc"; do
                if ! curl -fsSIL -o /dev/null "$base/$candidate"; then
                  echo "attempt $attempt/$max_attempts: $candidate not yet available"
                  missing=1
                fi
              done
            done
            if [ "$missing" -eq 0 ]; then
              echo "All artifacts and signatures resolve from Maven Central."
              exit 0
            fi
            sleep 60
          done

          echo "::error::Timed out waiting for artifacts to appear on repo1.maven.org"
          exit 1

  publish-npm:
    needs: [ get-configs, version-and-tag, release ]
    runs-on: ubuntu-latest
    environment: release-npm
    permissions:
      contents: read
      id-token: write
    env:
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11
          echo "npm version: $(npm --version)"

      - name: Match version with release tag
        working-directory: ${{ env.WORKING_DIR }}/bindings-wasm/dist
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "::error::committed bindings-wasm/dist not found. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          tmp=$(mktemp)
          jq --arg v "${{ inputs.tag }}" '.version = $v' package.json > "$tmp"
          mv "$tmp" package.json
          grep '"version"' package.json

      - name: Confirm tarball contents
        working-directory: ${{ env.WORKING_DIR }}/bindings-wasm/dist
        run: |
          set -euo pipefail

          pack_json="$(mktemp)"
          npm pack --dry-run --json > "$pack_json"

          echo "Packed file list:"
          jq -r '.[0].files[].path' "$pack_json"

          required=(
            "package.json"
            "index.js"
            "index.d.ts"
            "bindings_wasm.js"
            "bindings_wasm.d.ts"
            "bindings_wasm_bg.wasm"
            "bindings_wasm_bg.wasm.d.ts"
            "README.md"
            "LICENSE"
            "THIRD-PARTY-LICENSES.txt"
          )

          missing=0
          for want in "${required[@]}"; do
            if ! jq -e --arg f "$want" '.[0].files[] | select(.path == $f)' "$pack_json" >/dev/null; then
              echo "::error::expected file missing from npm tarball: $want"
              missing=1
            fi
          done

          rm -f "$pack_json"

          if [ "$missing" -ne 0 ]; then
            echo "::error::tarball content verification failed"
            exit 1
          fi
          echo "All required files are present in the tarball."

      - name: Publish to NPM
        working-directory: ${{ env.WORKING_DIR }}/bindings-wasm/dist
        run: |
          npm publish --access public --provenance \
            $([[ "${{ inputs.tag }}" == *-beta ]] && echo "--tag beta")

  verify-publish-npm:
    needs: [ get-configs, publish-npm ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.get-configs.outputs.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify published package
        run: |
          set -euo pipefail

          verify() {
            local tmp
            tmp="$(mktemp -d)"
            (
              cd "$tmp" \
                && npm init -y >/dev/null \
                && npm install "@aws/cloudformation-validate@${{ inputs.tag }}" --ignore-scripts \
                && npm audit signatures
            ) || return 1

            local predicate
            predicate=$(npm view "@aws/cloudformation-validate@${{ inputs.tag }}" dist.attestations.provenance.predicateType 2>/dev/null || true)
            if [ -z "$predicate" ]; then
              echo "no provenance attestation found for @aws/cloudformation-validate@${{ inputs.tag }}"
              return 1
            fi
            echo "provenance attestation predicateType: $predicate"
          }

          max_attempts=60
          for attempt in $(seq 1 "$max_attempts"); do
            echo "attempt $attempt/$max_attempts: verifying @aws/cloudformation-validate@${{ inputs.tag }}"
            if verify; then
              echo "Published package installed, signatures audited, and provenance verified."
              exit 0
            fi
            sleep 60
          done

          echo "::error::Timed out waiting for @aws/cloudformation-validate@${{ inputs.tag }} to verify against the npm registry"
          exit 1
