      - name: Verify Python wheel resolves from PyPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_directory="$(mktemp -d)"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "cloudformation_validate-$PYTHON_VERSION-*.whl" \
            --dir "$expected_directory"
          shopt -s nullglob
          expected_wheels=("$expected_directory"/*.whl)
          if [ ${#expected_wheels[@]} -ne 6 ]; then
            echo "::error::Expected six GitHub release wheels, found ${#expected_wheels[@]}."
            exit 1
          fi

          download_directory="$(mktemp -d)"
          max_attempts=60
          for attempt in $(seq 1 "$max_attempts"); do
            rm -f "$download_directory"/*
            echo "attempt $attempt/$max_attempts: downloading cloudformation-validate==$PYTHON_VERSION from PyPI"
            if python3 -m pip download \
              --disable-pip-version-check \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --index-url https://pypi.org/simple/ \
              --dest "$download_directory" \
              "cloudformation-validate==$PYTHON_VERSION"; then
              shopt -s nullglob
              wheels=("$download_directory"/*.whl)
              if [ ${#wheels[@]} -eq 1 ]; then
                expected_wheel="$expected_directory/$(basename "${wheels[0]}")"
                if [ ! -f "$expected_wheel" ] || ! cmp -s "${wheels[0]}" "$expected_wheel"; then
                  echo "::error::PyPI selected wheel does not byte-match the matching GitHub release wheel."
                  exit 1
                fi
                echo "PyPI selected wheel byte-matches the matching GitHub release wheel."
                exit 0
              fi
            fi
            sleep 60
          done

          echo "::error::Timed out waiting for cloudformation-validate==$PYTHON_VERSION on PyPI"
          exit 1

  publish-npm:
    needs: [ get-configs, version-and-tag, verify-release ]
    runs-on: ubuntu-latest
    environment: release-npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_KIND: ${{ needs.version-and-tag.outputs.release-kind }}
      RELEASE_TAG: ${{ inputs.tag }}
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11
          echo "npm version: $(npm --version)"

      - name: Match version with release tag
        working-directory: ${{ env.WORKING_DIR }}/bindings-wasm/dist
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "::error::committed bindings-wasm/dist not found. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          tmp="$(mktemp)"
          jq --arg version "$RELEASE_TAG" '.version = $version' package.json > "$tmp"
          mv "$tmp" package.json
          grep '"version"' package.json

      - name: Confirm tarball contents
        working-directory: ${{ env.WORKING_DIR }}/bindings-wasm/dist
        run: |
          set -euo pipefail

          pack_json="$(mktemp)"
          npm pack --dry-run --json > "$pack_json"

          echo "Packed file list:"
          jq -r '.[0].files[].path' "$pack_json"

          required=(
            "package.json"
            "index.js"
            "index.d.ts"
            "bindings_wasm.js"
            "bindings_wasm.d.ts"
            "bindings_wasm_bg.wasm"
            "bindings_wasm_bg.wasm.d.ts"
            "README.md"
            "LICENSE"
            "THIRD-PARTY-LICENSES.txt"
          )

          missing=0
          for want in "${required[@]}"; do
            if ! jq -e --arg f "$want" '.[0].files[] | select(.path == $f)' "$pack_json" >/dev/null; then
              echo "::error::expected file missing from npm tarball: $want"
              missing=1
            fi
          done

          rm -f "$pack_json"

          if [ "$missing" -ne 0 ]; then
            echo "::error::tarball content verification failed"
            exit 1
          fi
          echo "All required files are present in the tarball."

      - name: Publish to NPM
        working-directory: ${{ env.WORKING_DIR }}/bindings-wasm/dist
        run: |
          set -euo pipefail

          release_url="https://registry.npmjs.org/@aws%2Fcloudformation-validate/$RELEASE_TAG"
          registry_response="$(mktemp)"
          if ! http_status="$(curl --silent --show-error --location \
            --output "$registry_response" --write-out '%{http_code}' "$release_url")"; then
            rm -f "$registry_response"
            echo "::error::Failed to check NPM for release $RELEASE_TAG."
            exit 1
          fi
          case "$http_status" in
            200)
              rm -f "$registry_response"
              echo "NPM release $RELEASE_TAG already exists; skipping publication."
              exit 0
              ;;
            404) rm -f "$registry_response" ;;
            *)
              rm -f "$registry_response"
              echo "::error::NPM existence check returned HTTP $http_status; refusing to publish."
              exit 1
              ;;
          esac

          publish_options=(--access public --provenance)
          if [ "$RELEASE_KIND" = "beta" ]; then
            publish_options+=(--tag beta)
          fi
          npm publish "${publish_options[@]}"

  verify-publish-npm:
    needs: [ get-configs, version-and-tag, publish-npm ]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.get-configs.outputs.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify published package
        run: |
          set -euo pipefail

          verify() {
            local tmp
            tmp="$(mktemp -d)"
            (
              cd "$tmp" \
                && npm init -y >/dev/null \
                && npm install "@aws/cloudformation-validate@$RELEASE_TAG" --ignore-scripts \
                && npm audit signatures
            ) || return 1

            local predicate
            predicate=$(npm view "@aws/cloudformation-validate@$RELEASE_TAG" dist.attestations.provenance.predicateType 2>/dev/null || true)
            if [ -z "$predicate" ]; then
              echo "no provenance attestation found for @aws/cloudformation-validate@$RELEASE_TAG"
              return 1
            fi
            echo "provenance attestation predicateType: $predicate"
          }

          max_attempts=60
          for attempt in $(seq 1 "$max_attempts"); do
            echo "attempt $attempt/$max_attempts: verifying @aws/cloudformation-validate@$RELEASE_TAG"
            if verify; then
              echo "Published package installed, signatures audited, and provenance verified."
              exit 0
            fi
            sleep 60
          done

          echo "::error::Timed out waiting for @aws/cloudformation-validate@$RELEASE_TAG to verify against the npm registry"
          exit 1
