name: Release
run-name: Release ${{ inputs.tag }} from ${{ inputs.ref }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release (1.0.0 for prod, 1.0.0-beta for beta)"
        required: true
        type: string
      ref:
        description: "Source Git commit, branch, or tag"
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  get-configs:
    uses: ./.github/workflows/configs.yml

  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Pin release source commit
        id: source
        env:
          RELEASE_SOURCE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD^{commit})"
          echo "sha=$source_commit" >> "$GITHUB_OUTPUT"
          echo "Resolved release source $RELEASE_SOURCE_REF to commit $source_commit."

  validate:
    needs: [ resolve-ref ]
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      ref: ${{ needs.resolve-ref.outputs.sha }}
      fail-fast: true

  version-and-tag:
    needs: [ get-configs, resolve-ref, validate ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-kind: ${{ steps.validate-release.outputs.release-kind }}
      release-version: ${{ steps.validate-release.outputs.release-version }}
      cargo-version: ${{ steps.validate-release.outputs.cargo-version }}
      python-version: ${{ steps.validate-release.outputs.python-version }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Get version from Cargo.toml
        id: get-version
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "Cargo.toml version = $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate and classify release
        id: validate-release
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" == "$VERSION" ]]; then
            release_kind="production"
            python_version="$VERSION"
          elif [[ "$RELEASE_TAG" == "$VERSION-beta" ]]; then
            release_kind="beta"
            python_version="${VERSION}b0"
          else
            echo "::error::Tag ($RELEASE_TAG) must be $VERSION (production) or $VERSION-beta (beta)"
            exit 1
          fi

          {
            echo "release-kind=$release_kind"
            echo "release-version=$VERSION"
            echo "cargo-version=$RELEASE_TAG"
            echo "python-version=$python_version"
          } >> "$GITHUB_OUTPUT"
          echo "Tag $RELEASE_TAG is a $release_kind release; Cargo version is $RELEASE_TAG and Python version is $python_version."

      - name: Check release tag
        id: check-tags
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD^{commit})"

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            if [ "$tag_commit" != "$source_commit" ]; then
              echo "::error::Existing tag $RELEASE_TAG points to $tag_commit, not source commit $source_commit."
              exit 1
            fi
            echo 'missing=false' >> "$GITHUB_OUTPUT"
            echo "Existing tag $RELEASE_TAG already points to source commit $source_commit."
          else
            echo 'missing=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git
        if: steps.check-tags.outputs.missing == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push release tag
        if: steps.check-tags.outputs.missing == 'true'
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD^{commit})"
          git tag "$RELEASE_TAG" "$source_commit"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "Created and pushed tag $RELEASE_TAG at source commit $source_commit."

  release:
    needs: [ get-configs, version-and-tag ]
    runs-on: ubuntu-latest
    environment: release-github
    permissions:
      contents: write
      id-token: write
    env:
      PYTHON_VERSION: ${{ needs.version-and-tag.outputs.python-version }}
      RELEASE_KIND: ${{ needs.version-and-tag.outputs.release-kind }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ needs.version-and-tag.outputs.release-version }}
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Check existing GitHub release
        id: check-github-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! github_status="$(curl --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output /dev/null --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"; then
            echo "::error::Failed to check GitHub Releases for $RELEASE_TAG."
            exit 1
          fi

          case "$github_status" in
            200)
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              echo "GitHub release $RELEASE_TAG already exists; skipping creation."
              ;;
            404)
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              echo "GitHub release $RELEASE_TAG does not exist and will be created."
              ;;
            *)
              echo "::error::GitHub release lookup returned HTTP $github_status; refusing to publish."
              exit 1
              ;;
          esac

      - name: Assemble release artifacts
        if: steps.check-github-release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release

          jar="$WORKING_DIR/bindings-jvm/generated/cloudformation-validate.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::Missing $jar. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          cp "$jar" "release/cloudformation-validate-$RELEASE_TAG.jar"

          if [ ! -d "$WORKING_DIR/bindings-wasm/dist" ]; then
            echo "::error::bindings-wasm/dist not found. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi

          WASM_PKG_JSON="$WORKING_DIR/bindings-wasm/dist/package.json"
          if [ ! -f "$WASM_PKG_JSON" ]; then
            echo "::error::$WASM_PKG_JSON not found in committed dist."
            exit 1
          fi
          tmp="$(mktemp)"
          jq --arg version "$RELEASE_TAG" '.version = $version' "$WASM_PKG_JSON" > "$tmp"
          mv "$tmp" "$WASM_PKG_JSON"
          echo "WASM package version stamped to $RELEASE_TAG:"
          grep '"version"' "$WASM_PKG_JSON"

          ( cd "$WORKING_DIR/bindings-wasm" && zip -r "$GITHUB_WORKSPACE/release/cloudformation-validate-wasm-$RELEASE_TAG.zip" dist )

          wheels=("$WORKING_DIR"/bindings-python/generated/dist/*.whl)
          if [ ${#wheels[@]} -ne 6 ]; then
            echo "::error::Expected six wheels in $WORKING_DIR/bindings-python/generated/dist/, found ${#wheels[@]}. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          for wheel in "${wheels[@]}"; do
            case "$(basename "$wheel")" in
              cloudformation_validate-"$RELEASE_VERSION"-*.whl) ;;
              *)
                echo "::error::Committed wheel $(basename "$wheel") is not version $RELEASE_VERSION. Run the Build Artifacts workflow and merge its PR first."
                exit 1
                ;;
            esac
            "$WORKING_DIR/bindings-python/stamp-wheel.py" release "$wheel" "$PYTHON_VERSION"
          done
          release_wheels=(release/cloudformation_validate-"$PYTHON_VERSION"-*.whl)
          if [ ${#release_wheels[@]} -ne 6 ]; then
            echo "::error::Expected six stamped release wheels, found ${#release_wheels[@]}."
            exit 1
          fi

          if [ ! -f "$WORKING_DIR/bindings-go/go/go.mod" ]; then
            echo "::error::$WORKING_DIR/bindings-go/go/go.mod not found. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          go_libraries=("$WORKING_DIR"/bindings-go/go/libs/*/libbindings_go.a)
          if [ ${#go_libraries[@]} -eq 0 ]; then
            echo "::error::No static libraries in $WORKING_DIR/bindings-go/go/libs/. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          ( cd "$WORKING_DIR/bindings-go" && zip -r "$GITHUB_WORKSPACE/release/cloudformation-validate-go-$RELEASE_TAG.zip" go )

          binaries=("$GITHUB_WORKSPACE"/release-bin/cfn-validate-*)
          if [ ${#binaries[@]} -eq 0 ]; then
            echo "::error::No cfn-validate binaries found in $GITHUB_WORKSPACE/release-bin/. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          for bin in "${binaries[@]}"; do
            name="$(basename "$bin")"
            platform="${name#cfn-validate-}"
            extension=""
            case "$platform" in
              *.exe) platform="${platform%.exe}"; extension=".exe" ;;
            esac
            cp "$bin" "release/cfn-validate-$RELEASE_TAG-${platform}${extension}"
          done

          ls -lh release/

      - name: Configure AWS credentials for GitHub release signing
        if: steps.check-github-release.outputs.exists != 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.RELEASE_SIGNING_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Add KMS public key
        if: steps.check-github-release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          aws kms get-public-key \
            --region "${{ secrets.AWS_REGION }}" \
            --key-id "${{ secrets.RELEASE_SIGNING_KMS_KEY_ID }}" \
            --query PublicKey \
            --output text \
            | base64 -d > signing-key.der
          openssl pkey \
            -pubin \
            -inform DER \
            -in signing-key.der \
            -out release/signing-key.pem
          rm -f signing-key.der
          fingerprint="$(openssl pkey \
            -pubin \
            -in release/signing-key.pem \
            -outform DER \
            | openssl dgst -sha256 \
            | awk '{print $NF}')"
          printf '%s\n' "$fingerprint" > release/signing-key.pem.sha256
          echo "public key SHA-256: $fingerprint"

      - name: Add Maven PGP public key
        if: steps.check-github-release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          public_key_secret="$(aws secretsmanager get-secret-value \
            --secret-id "${{ secrets.MAVEN_GPG_PUBLIC_KEY_SECRET_ID }}" \
            --query SecretString \
            --output text)"
          public_key='release/cloudformation-validate-maven-signing-key.asc'
          fingerprint_file="$public_key.fingerprint"
          printf '%s' "$public_key_secret" | jq -er '.publicKey' > "$public_key"
          printf '%s' "$public_key_secret" | jq -er '.fingerprint' > "$fingerprint_file"
          unset public_key_secret

          expected_fingerprint="$(tr -d '[:space:]' < "$fingerprint_file" | tr '[:lower:]' '[:upper:]')"
          actual_fingerprint="$(gpg --batch --show-keys --with-colons "$public_key" \
            | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          if [ -z "$actual_fingerprint" ] || [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "::error::Maven PGP public key fingerprint does not match its configured fingerprint."
            exit 1
          fi
          echo "Maven PGP public key fingerprint: $actual_fingerprint"

      - name: Sign artifacts with KMS
        if: steps.check-github-release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in release/*; do
            case "$(basename "$f")" in
              signing-key.pem|signing-key.pem.sha256) continue ;;
            esac
            rm -f digest.bin
            openssl dgst -sha256 -binary "$f" > digest.bin

            aws kms sign \
              --region "${{ secrets.AWS_REGION }}" \
              --key-id "${{ secrets.RELEASE_SIGNING_KMS_KEY_ID }}" \
              --message fileb://digest.bin \
              --message-type DIGEST \
              --signing-algorithm RSASSA_PKCS1_V1_5_SHA_256 \
              --query Signature --output text | base64 -d > "$f.sig"

            echo "signed: $f -> $f.sig"
          done
          rm -f digest.bin

      - name: Verify signatures
        if: steps.check-github-release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in release/*; do
            case "$(basename "$f")" in
              *.sig|signing-key.pem|signing-key.pem.sha256) continue ;;
            esac
            echo "Verifying: $f"
            result=$(openssl dgst -sha256 -verify release/signing-key.pem -signature "$f.sig" "$f") || true
            echo "$result"
            if [ "$result" != "Verified OK" ]; then
              echo "::error::signature verification failed for $f"
              exit 1
            fi
          done

      - name: Create GitHub Release
        if: steps.check-github-release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ env.RELEASE_KIND == 'beta' }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true

  verify-release:
    needs:
      - get-configs
      - version-and-tag
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHON_VERSION: ${{ needs.version-and-tag.outputs.python-version }}
      RELEASE_KIND: ${{ needs.version-and-tag.outputs.release-kind }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ needs.version-and-tag.outputs.release-version }}
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Verify published GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          release_metadata="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName)"
          expected_prerelease=false
          if [ "$RELEASE_KIND" = 'beta' ]; then
            expected_prerelease=true
          fi
          if ! jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson prerelease "$expected_prerelease" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == $prerelease' \
            <<< "$release_metadata" >/dev/null; then
            echo "::error::GitHub release metadata does not match tag $RELEASE_TAG and release kind $RELEASE_KIND."
            jq . <<< "$release_metadata"
            exit 1
          fi

          download_directory="$(mktemp -d)"
          verification_directory="$(mktemp -d)"
          trap 'rm -rf "$download_directory" "$verification_directory"' EXIT
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$download_directory"

          expected_artifacts=(
            "cloudformation-validate-$RELEASE_TAG.jar"
            "cloudformation-validate-wasm-$RELEASE_TAG.zip"
            "cloudformation-validate-go-$RELEASE_TAG.zip"
            'cloudformation-validate-maven-signing-key.asc'
            'cloudformation-validate-maven-signing-key.asc.fingerprint'
          )

          committed_wheels=("$WORKING_DIR"/bindings-python/generated/dist/*.whl)
          if [ ${#committed_wheels[@]} -ne 6 ]; then
            echo "::error::Expected six committed Python wheels, found ${#committed_wheels[@]}."
            exit 1
          fi
          for wheel in "${committed_wheels[@]}"; do
            wheel_name="$(basename "$wheel")"
            case "$wheel_name" in
              cloudformation_validate-"$RELEASE_VERSION"-*.whl) ;;
              *)
                echo "::error::Committed wheel $wheel_name is not version $RELEASE_VERSION."
                exit 1
                ;;
            esac
            wheel_suffix="${wheel_name#cloudformation_validate-$RELEASE_VERSION-}"
            expected_artifacts+=("cloudformation_validate-$PYTHON_VERSION-$wheel_suffix")
          done

          committed_binaries=("$GITHUB_WORKSPACE"/release-bin/cfn-validate-*)
          if [ ${#committed_binaries[@]} -eq 0 ]; then
            echo "::error::No committed cfn-validate binaries found."
            exit 1
          fi
          for binary in "${committed_binaries[@]}"; do
            binary_name="$(basename "$binary")"
            platform="${binary_name#cfn-validate-}"
            extension=''
            case "$platform" in
              *.exe) platform="${platform%.exe}"; extension='.exe' ;;
            esac
            expected_artifacts+=("cfn-validate-$RELEASE_TAG-${platform}${extension}")
          done

          expected_files=(
            'signing-key.pem'
            'signing-key.pem.sha256'
          )
          for artifact in "${expected_artifacts[@]}"; do
            expected_files+=("$artifact" "$artifact.sig")
          done

          printf '%s\n' "${expected_files[@]}" | LC_ALL=C sort > "$verification_directory/expected-files"
          downloaded_paths=("$download_directory"/*)
          if [ ${#downloaded_paths[@]} -eq 0 ]; then
            echo "::error::GitHub release $RELEASE_TAG has no downloadable artifacts."
            exit 1
          fi
          for path in "${downloaded_paths[@]}"; do
            basename "$path"
          done | LC_ALL=C sort > "$verification_directory/downloaded-files"
          if ! diff -u "$verification_directory/expected-files" "$verification_directory/downloaded-files"; then
            echo "::error::GitHub release artifact inventory does not match the expected inventory."
            exit 1
          fi

          expected_signing_fingerprint="$(tr -d '[:space:]' \
            < "$download_directory/signing-key.pem.sha256" | tr '[:upper:]' '[:lower:]')"
          actual_signing_fingerprint="$(openssl pkey \
            -pubin \
            -in "$download_directory/signing-key.pem" \
            -outform DER \
            | openssl dgst -sha256 \
            | awk '{print tolower($NF)}')"
          if [[ ! "$expected_signing_fingerprint" =~ ^[0-9a-f]{64}$ ]] \
            || [ "$actual_signing_fingerprint" != "$expected_signing_fingerprint" ]; then
            echo "::error::Published KMS signing key fingerprint is invalid."
            exit 1
          fi

          maven_public_key="$download_directory/cloudformation-validate-maven-signing-key.asc"
          expected_maven_fingerprint="$(tr -d '[:space:]' \
            < "$maven_public_key.fingerprint" | tr '[:lower:]' '[:upper:]')"
          actual_maven_fingerprint="$(gpg --batch --show-keys --with-colons "$maven_public_key" \
            | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          if [ -z "$actual_maven_fingerprint" ] \
            || [ "$actual_maven_fingerprint" != "$expected_maven_fingerprint" ]; then
            echo "::error::Published Maven signing key fingerprint is invalid."
            exit 1
          fi

          for artifact in "${expected_artifacts[@]}"; do
            echo "Verifying published artifact: $artifact"
            if ! openssl dgst \
              -sha256 \
              -verify "$download_directory/signing-key.pem" \
              -signature "$download_directory/$artifact.sig" \
              "$download_directory/$artifact"; then
              echo "::error::Signature verification failed for published artifact $artifact."
              exit 1
            fi
          done
          echo "GitHub release metadata, inventory, signing keys, and all artifact signatures are valid."

  publish-crates:
    needs: [ get-configs, version-and-tag, verify-release ]
    runs-on: ubuntu-latest
    environment: release-crates
    permissions:
      contents: read
      id-token: write
    env:
      CRATE_PACKAGES: >-
        cloudformation-validate-template-model
        cloudformation-validate-data-source
        cloudformation-validate-rules
        cloudformation-validate-diagnostics
        cloudformation-validate-guard-translator
        cloudformation-validate-schema-validator
        cloudformation-validate-validation-engine
        cloudformation-validate-rego-engine
        cloudformation-validate-cel-engine
        cloudformation-validate
      RELEASE_KIND: ${{ needs.version-and-tag.outputs.release-kind }}
      RELEASE_VERSION: ${{ needs.version-and-tag.outputs.cargo-version }}
      WORKSPACE_VERSION: ${{ needs.version-and-tag.outputs.release-version }}
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Check existing crates.io releases
        id: check-crates
        run: |
          set -euo pipefail
          read -r -a packages <<< "$CRATE_PACKAGES"
          missing_packages=''

          for package in "${packages[@]}"; do
            if ! status="$(curl --silent --show-error --location \
              --header 'User-Agent: aws-cloudformation/cloudformation-validate release workflow' \
              --output /dev/null --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/$package/$RELEASE_VERSION")"; then
              echo "::error::Failed to check crates.io for $package $RELEASE_VERSION."
              exit 1
            fi
            case "$status" in
              200)
                echo "$package $RELEASE_VERSION already exists; skipping publication."
                ;;
              404)
                missing_packages="${missing_packages:+$missing_packages }$package"
                ;;
              *)
                echo "::error::crates.io existence check returned HTTP $status for $package $RELEASE_VERSION; refusing to publish."
                exit 1
                ;;
            esac
          done

          echo "missing-packages=$missing_packages" >> "$GITHUB_OUTPUT"
          if [ -z "$missing_packages" ]; then
            echo "All Rust crates already exist at $RELEASE_VERSION."
          else
            read -r -a packages <<< "$missing_packages"
            for package in "${packages[@]}"; do
              echo "Missing Rust crate: $package $RELEASE_VERSION"
            done
          fi

      - name: Setup Rust toolchain
        if: steps.check-crates.outputs.missing-packages != ''
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ needs.get-configs.outputs.rust-toolchain }}

      - name: Stamp beta Cargo workspace
        if: env.RELEASE_KIND == 'beta' && steps.check-crates.outputs.missing-packages != ''
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail
          workspace_assignment="version = \"$WORKSPACE_VERSION\""
          dependency_assignment="version = \"=$WORKSPACE_VERSION\""
          if [ "$(grep -cFx "$workspace_assignment" Cargo.toml)" -ne 1 ]; then
            echo "::error::Expected one workspace version assignment for $WORKSPACE_VERSION."
            exit 1
          fi
          if [ "$(grep -oF "$dependency_assignment" Cargo.toml | wc -l)" -ne 9 ]; then
            echo "::error::Expected nine internal dependency requirements for $WORKSPACE_VERSION."
            exit 1
          fi

          WORKSPACE_VERSION="$WORKSPACE_VERSION" RELEASE_VERSION="$RELEASE_VERSION" perl -0pi -e '
            my $workspace = $ENV{"WORKSPACE_VERSION"};
            my $release = $ENV{"RELEASE_VERSION"};
            my $workspace_updates = s{(\[workspace\.package\]\s*\nversion = )"\Q$workspace\E"}{$1 . qq{"$release"}}e;
            die "expected one workspace version update\n" unless $workspace_updates == 1;
            my $dependency_updates = s{version = "=\Q$workspace\E"}{qq{version = "=$release"}}ge;
            die "expected nine dependency version updates\n" unless $dependency_updates == 9;
          ' Cargo.toml

          metadata="$(cargo metadata --no-deps --format-version 1)"
          mapfile -t workspace_packages < <(jq -r '.packages[].name' <<< "$metadata")
          for package in "${workspace_packages[@]}"; do
            PACKAGE="$package" WORKSPACE_VERSION="$WORKSPACE_VERSION" RELEASE_VERSION="$RELEASE_VERSION" perl -0pi -e '
              my $package = $ENV{"PACKAGE"};
              my $workspace = $ENV{"WORKSPACE_VERSION"};
              my $release = $ENV{"RELEASE_VERSION"};
              my $updates = s{(\[\[package\]\]\nname = "\Q$package\E"\nversion = )"\Q$workspace\E"}{$1 . qq{"$release"}}e;
              die "expected one lock entry for $package\n" unless $updates == 1;
            ' Cargo.lock
          done

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          if ! jq -e --arg version "$RELEASE_VERSION" 'all(.packages[]; .version == $version)' <<< "$metadata" >/dev/null; then
            echo "::error::Not every workspace package was stamped to $RELEASE_VERSION."
            exit 1
          fi
          if [ "$(grep -oF "version = \"=$RELEASE_VERSION\"" Cargo.toml | wc -l)" -ne 9 ]; then
            echo "::error::Not every internal dependency was stamped to =$RELEASE_VERSION."
            exit 1
          fi
          git diff -- Cargo.toml Cargo.lock

      - name: Authenticate to crates.io with Trusted Publishing
        if: steps.check-crates.outputs.missing-packages != ''
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1.0.5

      - name: Publish missing Rust crates
        if: steps.check-crates.outputs.missing-packages != ''
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          MISSING_PACKAGES: ${{ steps.check-crates.outputs.missing-packages }}
        run: |
          set -euo pipefail
          read -r -a packages <<< "$MISSING_PACKAGES"
          for package in "${packages[@]}"; do
            if [ "$RELEASE_KIND" = 'beta' ]; then
              cargo publish --locked --allow-dirty -p "$package"
            else
              cargo publish --locked -p "$package"
            fi
          done

  verify-publish-crates:
    needs: [ resolve-ref, version-and-tag, publish-crates ]
    runs-on: ubuntu-latest
    env:
      CRATE_PACKAGES: >-
        cloudformation-validate-template-model
        cloudformation-validate-data-source
        cloudformation-validate-rules
        cloudformation-validate-diagnostics
        cloudformation-validate-guard-translator
        cloudformation-validate-schema-validator
        cloudformation-validate-validation-engine
        cloudformation-validate-rego-engine
        cloudformation-validate-cel-engine
        cloudformation-validate
      RELEASE_SOURCE_COMMIT: ${{ needs.resolve-ref.outputs.sha }}
      RELEASE_VERSION: ${{ needs.version-and-tag.outputs.cargo-version }}
    steps:
      - name: Verify published crate archives
        run: |
          set -euo pipefail
          read -r -a packages <<< "$CRATE_PACKAGES"
          max_attempts=60

          for package in "${packages[@]}"; do
            archive="$(mktemp)"
            available=false
            for attempt in $(seq 1 "$max_attempts"); do
              rm -f "$archive"
              echo "attempt $attempt/$max_attempts: downloading $package $RELEASE_VERSION from crates.io"
              if curl --fail --silent --show-error --location \
                --header 'User-Agent: aws-cloudformation/cloudformation-validate release workflow' \
                "https://crates.io/api/v1/crates/$package/$RELEASE_VERSION/download" \
                --output "$archive"; then
                if ! published_commit="$(
                  tar -xOf "$archive" "$package-$RELEASE_VERSION/.cargo_vcs_info.json" \
                    | jq -er '.git.sha1'
                )"; then
                  rm -f "$archive"
                  echo "::error::$package $RELEASE_VERSION has missing or malformed Cargo source provenance."
                  exit 1
                fi
                if [ "$published_commit" != "$RELEASE_SOURCE_COMMIT" ]; then
                  rm -f "$archive"
                  echo "::error::$package $RELEASE_VERSION records source commit $published_commit, expected $RELEASE_SOURCE_COMMIT."
                  exit 1
                fi
                available=true
                echo "$package $RELEASE_VERSION records source commit $RELEASE_SOURCE_COMMIT."
                break
              fi
              sleep 10
            done
            rm -f "$archive"
            if [ "$available" != true ]; then
              echo "::error::Timed out waiting for $package $RELEASE_VERSION on crates.io."
              exit 1
            fi
          done

  publish-go:
    needs: [ resolve-ref, version-and-tag, verify-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GO_MODULE_TAG: src/bindings-go/go/v${{ inputs.tag }}
      RELEASE_SOURCE_COMMIT: ${{ needs.resolve-ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Check existing Go module release
        id: check-go-release
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$GO_MODULE_TAG" >/dev/null; then
            tag_commit="$(git rev-parse "refs/tags/$GO_MODULE_TAG^{commit}")"
            if [ "$tag_commit" != "$RELEASE_SOURCE_COMMIT" ]; then
              echo "::error::Existing tag $GO_MODULE_TAG points to $tag_commit, not source commit $RELEASE_SOURCE_COMMIT."
              exit 1
            fi
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "Go module $GO_MODULE_TAG already exists at source commit $RELEASE_SOURCE_COMMIT; skipping publication."
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git
        if: steps.check-go-release.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish Go module tag
        if: steps.check-go-release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          git tag "$GO_MODULE_TAG" "$RELEASE_SOURCE_COMMIT"
          git push origin "refs/tags/$GO_MODULE_TAG"
          echo "Published Go module tag $GO_MODULE_TAG at source commit $RELEASE_SOURCE_COMMIT."

  verify-publish-go:
    needs: [ publish-go ]
    runs-on: ubuntu-latest
    env:
      GO_MODULE_PATH: github.com/aws-cloudformation/cloudformation-validate/src/bindings-go/go
      GO_MODULE_VERSION: v${{ inputs.tag }}
    steps:
      - name: Verify Go module artifacts resolve from the public proxy
        run: |
          set -euo pipefail
          download_directory="$(mktemp -d)"
          trap 'rm -rf "$download_directory"' EXIT
          base="https://proxy.golang.org/$GO_MODULE_PATH/@v/$GO_MODULE_VERSION"
          expected_prefix="$GO_MODULE_PATH@$GO_MODULE_VERSION/"

          verify() {
            rm -f "$download_directory"/*
            curl --fail --silent --show-error --location \
              --output "$download_directory/module.info" \
              "$base.info" || return 1
            curl --fail --silent --show-error --location \
              --output "$download_directory/go.mod" \
              "$base.mod" || return 1
            curl --fail --silent --show-error --location \
              --output "$download_directory/module.zip" \
              "$base.zip" || return 1

            jq -e --arg version "$GO_MODULE_VERSION" '.Version == $version' \
              "$download_directory/module.info" >/dev/null || return 1
            grep -Fx "module $GO_MODULE_PATH" "$download_directory/go.mod" >/dev/null || return 1
            unzip -Z1 "$download_directory/module.zip" > "$download_directory/contents"

            expected_files=(
              go.mod
              cfnvalidate.go
              version.go
              internal/bindings_go/bindings_go.go
              libs/darwin-aarch64/libbindings_go.a
              libs/linux-x86-64/libbindings_go.a
              libs/win32-x86-64/libbindings_go.a
            )
            for file in "${expected_files[@]}"; do
              grep -Fx "$expected_prefix$file" "$download_directory/contents" >/dev/null || return 1
            done
          }

          max_attempts=60
          for attempt in $(seq 1 "$max_attempts"); do
            echo "attempt $attempt/$max_attempts: downloading $GO_MODULE_PATH@$GO_MODULE_VERSION from proxy.golang.org"
            if verify; then
              echo "The public Go proxy serves the expected module metadata, source, generated bindings, and platform libraries."
              exit 0
            fi
            sleep 10
          done

          echo "::error::Timed out waiting for $GO_MODULE_PATH@$GO_MODULE_VERSION on proxy.golang.org."
          exit 1

  publish-maven:
    needs: [ get-configs, version-and-tag, verify-release ]
    runs-on: ubuntu-latest
    environment: release-maven
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Setup JVM toolchain
        uses: ./.github/actions/setup-jvm-toolchain
        with:
          java-version: ${{ needs.get-configs.outputs.java-version }}
          java-distribution: ${{ needs.get-configs.outputs.java-distribution }}
          kotlin-version: ${{ needs.get-configs.outputs.kotlin-version }}
          ktlint-version: ${{ needs.get-configs.outputs.ktlint-version }}
          gradle-version: ${{ needs.get-configs.outputs.gradle-version }}

      - name: Verify committed jar is present and multi-platform
        working-directory: ${{ env.WORKING_DIR }}/bindings-jvm
        run: |
          set -euo pipefail
          jar="generated/cloudformation-validate.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::Missing $jar. Run the Build Artifacts workflow and merge its PR first."
            exit 1
          fi
          for prefix in linux-x86-64 linux-aarch64 darwin-x86-64 darwin-aarch64 win32-x86-64 win32-aarch64; do
            if ! unzip -Z1 "$jar" | grep -q "^$prefix/"; then
              echo "::error::native library for $prefix missing from committed jar; the all-platform merge did not run"
              exit 1
            fi
          done
          if ! unzip -Z1 "$jar" | grep -q '\.class$'; then
            echo "::error::committed jar contains no compiled .class output; the JVM build did not compile"
            exit 1
          fi
          if ! unzip -Z1 "$jar" | grep -q '\.kt$'; then
            echo "::error::committed jar contains no .kt sources; the source bundling step did not run"
            exit 1
          fi
          echo "Committed jar carries all six platform natives plus compiled classes and sources."

      - name: Configure AWS credentials for Maven publishing
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.MAVEN_PUBLISHING_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build signed Central Portal bundle
        working-directory: ${{ env.WORKING_DIR }}/bindings-jvm
        run: |
          set -euo pipefail

          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id "${{ secrets.MAVEN_GPG_PRIVATE_KEY_SECRET_ID }}" --query SecretString --output text)"
          signing_key="$(printf '%s' "$secret_json" | jq -er '.privateKey')"
          signing_password="$(printf '%s' "$secret_json" | jq -er '.passphrase')"
          while IFS= read -r private_key_line; do
            if [ -n "$private_key_line" ]; then
              printf '::add-mask::%s\n' "$private_key_line"
            fi
          done <<< "$signing_key"
          printf '::add-mask::%s\n' "$signing_password"
          export ORG_GRADLE_PROJECT_signingKey="$signing_key"
          export ORG_GRADLE_PROJECT_signingPassword="$signing_password"
          unset secret_json signing_key signing_password

          ./generate-version-properties.sh "$RELEASE_TAG"
          gradle --no-daemon --console=plain centralBundle
          ls -lh build/central/

      - name: Verify every artifact is signed
        working-directory: ${{ env.WORKING_DIR }}/bindings-jvm
        run: |
          set -euo pipefail
          bundle="$(ls build/central/*-bundle.zip)"
          tmp="$(mktemp -d)"
          unzip -qo "$bundle" -d "$tmp"
          base="$tmp/software/amazon/cloudformation/cloudformation-validate/$RELEASE_TAG"
          missing=0
          for suffix in .jar -sources.jar -javadoc.jar .pom; do
            artifact="cloudformation-validate-$RELEASE_TAG${suffix}"
            for companion in asc md5 sha1; do
              if [ ! -f "$base/$artifact.$companion" ]; then
                echo "::error::missing $artifact.$companion in bundle"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] && echo "All artifacts carry .asc/.md5/.sha1." || exit 1

          for suffix in .jar -sources.jar -javadoc.jar .pom; do
            artifact="cloudformation-validate-$RELEASE_TAG${suffix}"
            for algorithm in md5 sha1; do
              expected_checksum="$(tr -d '[:space:]' < "$base/$artifact.$algorithm" | tr '[:upper:]' '[:lower:]')"
              actual_checksum="$("${algorithm}sum" "$base/$artifact" | awk '{print $1}')"
              if [ "$expected_checksum" != "$actual_checksum" ]; then
                echo "::error::$artifact.$algorithm does not match $artifact in the intended bundle."
                exit 1
              fi
            done
          done
          echo "All intended Maven checksums match their artifacts."

          committed_sha="$(sha256sum generated/cloudformation-validate.jar | awk '{print $1}')"
          bundle_sha="$(sha256sum "$base/cloudformation-validate-$RELEASE_TAG.jar" | awk '{print $1}')"
          if [ "$committed_sha" != "$bundle_sha" ]; then
            echo "::error::Maven bundle jar ($bundle_sha) differs from the committed jar ($committed_sha) that the GitHub release ships. They must be byte-identical."
            exit 1
          fi
          echo "Maven bundle jar is byte-identical to the committed jar (sha256 $committed_sha)."

      - name: Publish to Central Portal
        working-directory: ${{ env.WORKING_DIR }}/bindings-jvm
        run: |
          set -euo pipefail

          bundle="$(ls build/central/*-bundle.zip)"
          maven_base="https://repo1.maven.org/maven2/software/amazon/cloudformation/cloudformation-validate/$RELEASE_TAG"
          maven_release_url="$maven_base/cloudformation-validate-$RELEASE_TAG.pom"
          if ! http_status="$(curl --silent --show-error --location \
            --output /dev/null --write-out '%{http_code}' "$maven_release_url")"; then
            echo "::error::Failed to check Maven Central for release $RELEASE_TAG."
            exit 1
          fi
          case "$http_status" in
            200)
              echo "Maven Central release $RELEASE_TAG already exists; skipping publication."
              exit 0
              ;;
            404) ;;
            *)
              echo "::error::Maven Central existence check returned HTTP $http_status; refusing to publish."
              exit 1
              ;;
          esac

          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_SECRET_ID }}" --query SecretString --output text)"
          username="$(printf '%s' "$secret_json" | jq -er '.username')"
          password="$(printf '%s' "$secret_json" | jq -er '.password')"
          token="$(printf '%s:%s' "$username" "$password" | base64 | tr -d '\n')"
          printf '::add-mask::%s\n' "$username"
          printf '::add-mask::%s\n' "$password"
          printf '::add-mask::%s\n' "$token"
          unset secret_json username password

          deployment_id="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@$bundle" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=cloudformation-validate-$RELEASE_TAG")"
          echo "Central Portal deployment id: $deployment_id"

          max_attempts=60
          for attempt in $(seq 1 "$max_attempts"); do
            status_json="$(curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $token" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$deployment_id")"
            state="$(printf '%s' "$status_json" | jq -r '.deploymentState')"
            echo "attempt $attempt/$max_attempts: deploymentState=$state"

            case "$state" in
              PUBLISHED)
                echo "Deployment published to Maven Central."
                exit 0
                ;;
              PUBLISHING)
                echo "Validation passed; the Portal is publishing to Maven Central."
                exit 0
                ;;
              FAILED)
                echo "::error::Central Portal validation failed for deployment $deployment_id"
                printf '%s\n' "$status_json" | jq .
                exit 1
                ;;
            esac
            sleep 30
          done

          echo "::error::Timed out waiting for Central Portal deployment $deployment_id to validate"
          exit 1

  verify-publish-maven:
    needs: [ version-and-tag, publish-maven ]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Verify artifacts and signatures resolve from Maven Central
        run: |
          set -euo pipefail
          base="https://repo1.maven.org/maven2/software/amazon/cloudformation/cloudformation-validate/$RELEASE_TAG"
          files=(
            "cloudformation-validate-$RELEASE_TAG.pom"
            "cloudformation-validate-$RELEASE_TAG.jar"
            "cloudformation-validate-$RELEASE_TAG-sources.jar"
            "cloudformation-validate-$RELEASE_TAG-javadoc.jar"
          )

          verify() {
            local download_dir
            download_dir="$(mktemp -d)"
            for artifact in "${files[@]}"; do
              curl --fail --silent --show-error --location \
                --output "$download_dir/$artifact" \
                "$base/$artifact" || return 1
              curl --fail --silent --show-error --location \
                --output "$download_dir/$artifact.asc" \
                "$base/$artifact.asc" || return 1
              for algorithm in md5 sha1; do
                curl --fail --silent --show-error --location \
                  --output "$download_dir/$artifact.$algorithm" \
                  "$base/$artifact.$algorithm" || return 1
                expected_checksum="$(tr -d '[:space:]' < "$download_dir/$artifact.$algorithm" | tr '[:upper:]' '[:lower:]')"
                actual_checksum="$("${algorithm}sum" "$download_dir/$artifact" | awk '{print $1}')"
                [ "$expected_checksum" = "$actual_checksum" ] || return 1
              done
            done
          }

          max_attempts=60
          for attempt in $(seq 1 "$max_attempts"); do
            echo "attempt $attempt/$max_attempts: checking Maven Central artifacts, signatures, and checksums"
            if verify; then
              echo "All Maven artifacts and signatures resolve, and all checksums match."
              exit 0
            fi
            sleep 60
          done

          echo "::error::Timed out waiting for Maven Central artifacts, signatures, and checksums"
          exit 1

  publish-python-beta:
    if: needs.version-and-tag.outputs.release-kind == 'beta'
    needs: [ version-and-tag, verify-release ]
    runs-on: ubuntu-latest
    environment: release-python-beta
    permissions:
      contents: read
      id-token: write
    env:
      PYTHON_VERSION: ${{ needs.version-and-tag.outputs.python-version }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download Python wheels from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "cloudformation_validate-$PYTHON_VERSION-*.whl" \
            --dir dist
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 6 ]; then
            echo "::error::Expected six Python wheels for $PYTHON_VERSION, found ${#wheels[@]}."
            exit 1
          fi

      - name: Check existing TestPyPI release
        id: check-python-release
        run: |
          set -euo pipefail
          registry_response="$(mktemp)"
          if ! http_status="$(curl --silent --show-error --location \
            --output "$registry_response" --write-out '%{http_code}' \
            'https://test.pypi.org/pypi/cloudformation-validate/json')"; then
            rm -f "$registry_response"
            echo "::error::Failed to check TestPyPI for Python version $PYTHON_VERSION."
            exit 1
          fi
          case "$http_status" in
            200)
              if ! release_exists="$(jq -r --arg version "$PYTHON_VERSION" '
                if (.releases | type) != "object" then error("missing releases object")
                else (.releases | has($version)) end
              ' "$registry_response")"; then
                rm -f "$registry_response"
                echo "::error::TestPyPI returned invalid project metadata; refusing to publish."
                exit 1
              fi
              rm -f "$registry_response"
              ;;
            404)
              rm -f "$registry_response"
              release_exists=false
              ;;
            *)
              rm -f "$registry_response"
              echo "::error::TestPyPI existence check returned HTTP $http_status; refusing to publish."
              exit 1
              ;;
          esac
          echo "exists=$release_exists" >> "$GITHUB_OUTPUT"
          if [ "$release_exists" = 'true' ]; then
            echo "TestPyPI release $PYTHON_VERSION already exists; skipping publication."
          else
            echo "TestPyPI release $PYTHON_VERSION does not exist and will be published."
          fi

      - name: Publish Python wheels to TestPyPI with Trusted Publishing
        if: steps.check-python-release.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  verify-publish-python-beta:
    if: needs.version-and-tag.outputs.release-kind == 'beta'
    needs: [ get-configs, version-and-tag, publish-python-beta ]
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ needs.version-and-tag.outputs.python-version }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.get-configs.outputs.python-version }}

      - name: Verify Python wheel resolves from TestPyPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_directory="$(mktemp -d)"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "cloudformation_validate-$PYTHON_VERSION-*.whl" \
            --dir "$expected_directory"
          shopt -s nullglob
          expected_wheels=("$expected_directory"/*.whl)
          if [ ${#expected_wheels[@]} -ne 6 ]; then
            echo "::error::Expected six GitHub release wheels, found ${#expected_wheels[@]}."
            exit 1
          fi

          download_directory="$(mktemp -d)"
          max_attempts=60
          for attempt in $(seq 1 "$max_attempts"); do
            rm -f "$download_directory"/*
            echo "attempt $attempt/$max_attempts: downloading cloudformation-validate==$PYTHON_VERSION from TestPyPI"
            if python3 -m pip download \
              --disable-pip-version-check \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ \
              --dest "$download_directory" \
              "cloudformation-validate==$PYTHON_VERSION"; then
              shopt -s nullglob
              wheels=("$download_directory"/*.whl)
              if [ ${#wheels[@]} -eq 1 ]; then
                expected_wheel="$expected_directory/$(basename "${wheels[0]}")"
                if [ ! -f "$expected_wheel" ] || ! cmp -s "${wheels[0]}" "$expected_wheel"; then
                  echo "::error::TestPyPI selected wheel does not byte-match the matching GitHub release wheel."
                  exit 1
                fi
                echo "TestPyPI selected wheel byte-matches the matching GitHub release wheel."
                exit 0
              fi
            fi
            sleep 60
          done

          echo "::error::Timed out waiting for cloudformation-validate==$PYTHON_VERSION on TestPyPI"
          exit 1

  publish-python-prod:
    if: needs.version-and-tag.outputs.release-kind == 'production'
    needs: [ version-and-tag, verify-release ]
    runs-on: ubuntu-latest
    environment: release-python-prod
    permissions:
      contents: read
      id-token: write
