name: Validate

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out'
        required: true
        type: string
      fail-fast:
        description: 'Cancel remaining matrix jobs as soon as one fails'
        required: false
        type: boolean
        default: false
      release-run:
        description: 'Run every binding test matrix for a release workflow'
        required: false
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to check out'
        required: true
        type: string
      fail-fast:
        description: 'Cancel remaining matrix jobs as soon as one fails'
        required: false
        type: boolean
        default: false
      release-run:
        description: 'Run every binding test matrix for a release workflow'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_tests: ${{ inputs.release-run || steps.filter.outputs.release_assets == 'true' }}
    steps:
    - if: ${{ !inputs.release-run && github.event_name == 'push' }}
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Detect changed release assets
      if: ${{ !inputs.release-run && (github.event_name == 'pull_request' || github.event_name == 'push') }}
      id: filter
      uses: dorny/paths-filter@v4.0.3
      with:
        base: main
        filters: |
          release_assets:
            - 'release-bin/**'
            - 'src/bindings-jvm/generated/**'
            - 'src/bindings-wasm/dist/**'
            - 'src/bindings-python/generated/dist/**'
            - 'src/bindings-go/go/internal/**'
            - 'src/bindings-go/go/libs/**'

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Load build configs
      id: configs
      uses: ./.github/actions/load-configs

    - name: Install Rust ${{ steps.configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ steps.configs.outputs.rust-toolchain }}

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Format
      working-directory: ${{ env.WORKING_DIR }}
      run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Load build configs
      id: configs
      uses: ./.github/actions/load-configs

    - name: Install Rust ${{ steps.configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ steps.configs.outputs.rust-toolchain }}
        components: clippy

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Clippy
      working-directory: ${{ env.WORKING_DIR }}
      run: cargo clippy --locked --all-targets --workspace -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Load build configs
      id: configs
      uses: ./.github/actions/load-configs

    - name: Install Rust ${{ steps.configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ steps.configs.outputs.rust-toolchain }}

    - name: Install cargo-audit ${{ steps.configs.outputs.cargo-audit-version }}
      uses: taiki-e/install-action@v2.86.7
      with:
        tool: cargo-audit@${{ steps.configs.outputs.cargo-audit-version }}

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Audit dependencies for known vulnerabilities
      working-directory: ${{ env.WORKING_DIR }}
      run: cargo audit

  test:
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        include:
        - { os: ubuntu-latest, coverage: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Load build configs
      id: configs
      uses: ./.github/actions/load-configs

    - name: Install Rust ${{ steps.configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ steps.configs.outputs.rust-toolchain }}
        components: ${{ matrix.coverage && 'llvm-tools-preview' || '' }}

    - name: Install cargo-llvm-cov ${{ steps.configs.outputs.cargo-llvm-cov-version }}
      if: ${{ matrix.coverage }}
      uses: taiki-e/install-action@v2.86.7
      with:
        tool: cargo-llvm-cov@${{ steps.configs.outputs.cargo-llvm-cov-version }}

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Test build support scripts
      working-directory: scripts/build-support/tests
      run: bash ./run.sh

    - name: Test
      if: ${{ !matrix.coverage }}
      working-directory: ${{ env.WORKING_DIR }}
      run: cargo test --locked --profile ci --workspace --no-fail-fast

    - name: Test with coverage
      if: ${{ matrix.coverage }}
      working-directory: ${{ env.WORKING_DIR }}
      run: cargo llvm-cov --locked --profile ci --workspace --no-fail-fast

  performance:
    uses: ./.github/workflows/performance-regression.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.ref }}

  test-jvm:
    if: ${{ needs.release-assets.outputs.run_tests == 'true' }}
    needs: [ release-assets ]
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        include:
        - { os: ubuntu-latest, platform: linux, arch: x64 }
        - { os: ubuntu-24.04-arm, platform: linux, arch: aarch64 }
        - { os: macos-latest, platform: darwin, arch: aarch64 }
        - { os: macos-15-intel, platform: darwin, arch: x64 }
        - { os: windows-latest, platform: win32, arch: x64 }
        - { os: windows-11-arm, platform: win32, arch: aarch64, java-distribution: microsoft }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Load build configs
      id: configs
      uses: ./.github/actions/load-configs

    - name: Install Rust ${{ steps.configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ steps.configs.outputs.rust-toolchain }}

    - name: Setup JVM toolchain
      uses: ./.github/actions/setup-jvm-toolchain
      with:
        java-version: ${{ steps.configs.outputs.java-version }}
        java-distribution: ${{ matrix.java-distribution || steps.configs.outputs.java-distribution }}
        kotlin-version: ${{ steps.configs.outputs.kotlin-version }}
        ktlint-version: ${{ steps.configs.outputs.ktlint-version }}
        gradle-version: ${{ steps.configs.outputs.gradle-version }}

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions
      with:
        jacoco-version: ${{ steps.configs.outputs.jacoco-version }}

    - name: Test
      working-directory: ${{ env.WORKING_DIR }}/bindings-jvm/tests
      run: ./run.sh

  test-wasm:
    if: ${{ needs.release-assets.outputs.run_tests == 'true' }}
    needs: [ release-assets ]
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        include:
        - { os: ubuntu-latest, platform: linux, arch: x64 }
        - { os: ubuntu-24.04-arm, platform: linux, arch: aarch64 }
        - { os: macos-latest, platform: darwin, arch: aarch64 }
        - { os: macos-15-intel, platform: darwin, arch: x64 }
        - { os: windows-latest, platform: win32, arch: x64 }
        - { os: windows-11-arm, platform: win32, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Load build configs
      id: configs
      uses: ./.github/actions/load-configs

    - name: Install Rust ${{ steps.configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ steps.configs.outputs.rust-toolchain }}

    - name: Setup Node.js ${{ steps.configs.outputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.configs.outputs.node-version }}

    - name: Install wasm-pack ${{ steps.configs.outputs.wasm-pack-version }}
      uses: taiki-e/install-action@v2.86.7
      with:
        tool: wasm-pack@${{ steps.configs.outputs.wasm-pack-version }}

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Test
      working-directory: ${{ env.WORKING_DIR }}/bindings-wasm/tests
      run: ./run.sh

  test-python:
    if: ${{ needs.release-assets.outputs.run_tests == 'true' }}
    needs: [ release-assets ]
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        include:
        - { os: ubuntu-latest, platform: linux, arch: x64 }
        - { os: ubuntu-24.04-arm, platform: linux, arch: aarch64 }
        - { os: macos-latest, platform: darwin, arch: aarch64 }
        - { os: macos-15-intel, platform: darwin, arch: x64 }
        - { os: windows-latest, platform: win32, arch: x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Load build configs
      id: configs
      uses: ./.github/actions/load-configs

    - name: Install Rust ${{ steps.configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ steps.configs.outputs.rust-toolchain }}

    - name: Setup Python ${{ steps.configs.outputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ steps.configs.outputs.python-version }}

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Test
      working-directory: ${{ env.WORKING_DIR }}
      run: ./bindings-python/tests/run.sh

  test-go:
    if: ${{ needs.release-assets.outputs.run_tests == 'true' }}
    needs: [ release-assets ]
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        include:
        - { os: ubuntu-latest, platform: linux, arch: x64 }
        - { os: ubuntu-24.04-arm, platform: linux, arch: aarch64 }
        - { os: macos-latest, platform: darwin, arch: aarch64 }
        - { os: macos-15-intel, platform: darwin, arch: x64 }
        - { os: windows-latest, platform: win32, arch: x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Load build configs
      id: configs
      uses: ./.github/actions/load-configs

    - name: Install Rust ${{ steps.configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ steps.configs.outputs.rust-toolchain }}

    - name: Setup Go ${{ steps.configs.outputs.go-version }}
      uses: actions/setup-go@v6
      with:
        go-version: ${{ steps.configs.outputs.go-version }}

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Test
      working-directory: ${{ env.WORKING_DIR }}
      run: ./bindings-go/tests/run.sh
