name: Validate

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out'
        required: true
        type: string
      fail-fast:
        description: 'Cancel remaining matrix jobs as soon as one fails'
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to check out'
        required: true
        type: string
      fail-fast:
        description: 'Cancel remaining matrix jobs as soon as one fails'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  get-configs:
    uses: ./.github/workflows/configs.yml

  format:
    needs: [ get-configs ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Install Rust ${{ needs.get-configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ needs.get-configs.outputs.rust-toolchain }}

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Format
      working-directory: ${{ needs.get-configs.outputs.working-dir }}
      run: cargo fmt --all --check

  lint:
    needs: [ get-configs ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Install Rust ${{ needs.get-configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ needs.get-configs.outputs.rust-toolchain }}
        components: clippy

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ needs.get-configs.outputs.working-dir }}

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Clippy
      working-directory: ${{ needs.get-configs.outputs.working-dir }}
      run: cargo clippy --locked --all-targets --workspace -- -D warnings

  audit:
    needs: [ get-configs ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Install Rust ${{ needs.get-configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ needs.get-configs.outputs.rust-toolchain }}

    - name: Install cargo-audit ${{ needs.get-configs.outputs.cargo-audit-version }}
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit@${{ needs.get-configs.outputs.cargo-audit-version }}

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Audit dependencies for known vulnerabilities
      working-directory: ${{ needs.get-configs.outputs.working-dir }}
      run: cargo audit

  test:
    needs: [ get-configs ]
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Install Rust ${{ needs.get-configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ needs.get-configs.outputs.rust-toolchain }}
        components: llvm-tools-preview

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ env.WORKING_DIR }}

    - name: Install cargo-llvm-cov ${{ needs.get-configs.outputs.cargo-llvm-cov-version }}
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov@${{ needs.get-configs.outputs.cargo-llvm-cov-version }}

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Test
      working-directory: ${{ env.WORKING_DIR }}
      run: cargo llvm-cov --locked --release --workspace --no-fail-fast

  test-jvm:
    needs: [ get-configs ]
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Install Rust ${{ needs.get-configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ needs.get-configs.outputs.rust-toolchain }}

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ env.WORKING_DIR }}

    - name: Setup JVM toolchain
      uses: ./.github/actions/setup-jvm-toolchain
      with:
        java-version: ${{ needs.get-configs.outputs.java-version }}
        java-distribution: ${{ needs.get-configs.outputs.java-distribution }}
        kotlin-version: ${{ needs.get-configs.outputs.kotlin-version }}
        ktlint-version: ${{ needs.get-configs.outputs.ktlint-version }}
        gradle-version: ${{ needs.get-configs.outputs.gradle-version }}

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions
      with:
        jacoco-version: ${{ needs.get-configs.outputs.jacoco-version }}

    - name: Test
      working-directory: ${{ env.WORKING_DIR }}/bindings-jvm/tests
      run: ./run.sh

  test-wasm:
    needs: [ get-configs ]
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      WORKING_DIR: ${{ needs.get-configs.outputs.working-dir }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Install Rust ${{ needs.get-configs.outputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ needs.get-configs.outputs.rust-toolchain }}

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ env.WORKING_DIR }}

    - name: Setup Node.js ${{ needs.get-configs.outputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ needs.get-configs.outputs.node-version }}

    - name: Install wasm-pack ${{ needs.get-configs.outputs.wasm-pack-version }}
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack@${{ needs.get-configs.outputs.wasm-pack-version }}

    - name: Log tool versions
      uses: ./.github/actions/print-build-versions

    - name: Test
      working-directory: ${{ env.WORKING_DIR }}/bindings-wasm/tests
      run: ./run.sh
